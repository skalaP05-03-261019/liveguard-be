services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liveguard}
      POSTGRES_USER: ${POSTGRES_USER:-liveguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요 (.env.example 참고)}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - liveguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-alpine
    profiles: ["rabbit"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-liveguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
    volumes:
      - liveguard-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  liveguard-db:
  liveguard-rabbitmq:
