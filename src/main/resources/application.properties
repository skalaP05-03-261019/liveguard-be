spring.application.name=liveguard

# 알 수 없는 요청 필드는 거부한다 (openapi additionalProperties: false)
spring.jackson.deserialization.fail-on-unknown-properties=true

# 로그에 traceId를 붙인다 (끝의 \u0020은 뒤따르는 공백)
logging.pattern.correlation=[%X{traceId:-}]\u0020

# B1(V1xx)·B2(V2xx) 버전 대역을 같이 쓰므로, 이미 V2xx가 적용된 DB에도 새 V1xx를 적용한다(A-20).
# 대역 사이 마이그레이션은 서로의 테이블에 의존하지 않게 작성한다.
spring.flyway.out-of-order=true

# 세션 쿠키 (JSESSIONID). HttpOnly는 기본값 true
server.servlet.session.cookie.same-site=lax

# /internal/** 서비스 토큰 (Agent·business-mcp가 X-Service-Token으로 보냄). 비어 있으면 모든 내부 요청 거부
liveguard.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

# Outbound Agent task delivery is opt-in; no chat/decision flow enqueues automatically.
liveguard.agent.delivery.enabled=${AGENT_DELIVERY_ENABLED:false}
liveguard.agent.delivery.base-url=${AGENT_BASE_URL:}
liveguard.agent.delivery.service-token=${AGENT_SERVICE_TOKEN:}
