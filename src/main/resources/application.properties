spring.application.name=liveguard

# 알 수 없는 요청 필드는 거부한다 (openapi additionalProperties: false)
spring.jackson.deserialization.fail-on-unknown-properties=true

# 로그에 traceId를 붙인다 (끝의 \u0020은 뒤따르는 공백)
logging.pattern.correlation=[%X{traceId:-}]\u0020

# B1(V1xx)·B2(V2xx) 버전 대역을 같이 쓰므로, 이미 V2xx가 적용된 DB에도 새 V1xx를 적용한다(A-20).
# 대역 사이 마이그레이션은 서로의 테이블에 의존하지 않게 작성한다.
spring.flyway.out-of-order=true

# 세션 쿠키 (JSESSIONID). HttpOnly는 기본값 true
server.servlet.session.cookie.same-site=lax

# /internal/** 서비스 토큰 (Agent·business-mcp가 X-Service-Token으로 보냄). 비어 있으면 모든 내부 요청 거부
liveguard.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

# 활성 정책 버전 (TBD-08, A-27). v3.1·v3.2 중 하나이며 BE·Agent·RAG가 같은 값을 쓴다. 필터 버전(norm-v1+dict-v2+rules-v2)과는 별개
# 비어 있으면 PolicyProperties.DEFAULT_VERSION(v3.2)
liveguard.policy.version=${LIVEGUARD_POLICY_VERSION:}

# Delivery is opt-in; canonical candidates and decisions enqueue atomically even when delivery is disabled.
liveguard.agent.delivery.enabled=${AGENT_DELIVERY_ENABLED:false}
liveguard.agent.delivery.transport=${AGENT_DELIVERY_TRANSPORT:db}
liveguard.agent.delivery.base-url=${AGENT_BASE_URL:}
liveguard.agent.delivery.service-token=${AGENT_SERVICE_TOKEN:}

# Agent 판정을 기다리는 최대 시간. 지나거나 분석이 거절되면 AI 판정 없이 문맥 검토를 연다(A-25). 메시지는 HELD 유지
liveguard.guard.judgment-fallback.deadline=${LIVEGUARD_JUDGMENT_DEADLINE:3m}
# 강퇴 승인 뒤 Agent가 실행을 이어받기를 기다리는 최대 시간. 지나면 BE가 재검증해 실행한다(A-25)
liveguard.guard.kick-handoff.deadline=${LIVEGUARD_KICK_HANDOFF_DEADLINE:3m}
# 판정 마감 주기 작업이 Agent 전달 poll과 한 스레드를 나눠 쓰지 않게 한다
spring.task.scheduling.pool.size=2

# Used only by the opt-in Rabbit transport; disabled delivery opens no broker connection.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
