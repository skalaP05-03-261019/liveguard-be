      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalPostEvent
      summary: Agent 진행 이벤트 수신 → 관제 SSE 중계
      x-owner: B1
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEventRequest'
      responses:
        '202':
          description: 중계 완료
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LiveId:
      name: liveId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: UUID is reused; any non-UUID value is ignored and replaced with a generated UUID.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  responses:
    Error:
      description: 오류
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: Contract stub; no business operation was executed. Error code NOT_IMPLEMENTED, retryable=false.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotImplementedErrorResponse'
    EventStream:
      description: SSE. 각 이벤트는 `id`, `event`, `data`(JSON)로 구성된다.
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            id: 42
            event: MESSAGE_VISIBILITY_CHANGED
            data: {"messageId":"33333333-3333-4333-8333-333333333333","visibility":"HIDDEN","version":2}

            : ping

  headers:
    TraceId:
      description: UUID trace identifier reused from a valid request header or generated by the server.
      schema:
        type: string
        format: uuid

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Role:
      type: string
      enum: [VIEWER, MODERATOR, PLATFORM_ADMIN]
    Visibility:
      type: string
      enum: [PUBLIC, HELD, HIDDEN]
    FilterResult:
      type: string
      description: REVIEW는 v3.1 처리 경로에서 쓰지 않는다(새 의미를 부여하지 않음). 처리 경로는 HandlingRoute로 표현한다.
      enum: [PASS, REVIEW, HOLD, FLOOD]
    HandlingRoute:
      type: string
      description: |
        1차 필터가 정하는 처리 경로. 한 메시지에 하나.
        우선순위 RULE_CONFIRMED > FLOOD_REVIEW > PII_INVESTIGATION > CONTEXT_REVIEW > PASS (TBD-02).
      enum: [PASS, RULE_CONFIRMED, CONTEXT_REVIEW, PII_INVESTIGATION, FLOOD_REVIEW]
    ConfirmationStatus:
      type: string
      description: 사건 확정 상태(E-3). DEFER는 확정이 아니므로 PENDING을 유지한다.
      enum: [PENDING, CONFIRMED_VIOLATION, CONFIRMED_NORMAL, CANCELLED]
    ReviewKind:
      type: string
      enum: [CONTEXT, KICK]
    ReviewStatus:
      type: string
      description: 결정 상태. 실행 상태(ActionStatus)와 분리한다. 최종 결정이 저장될 때만 DECIDED.
      enum: [PENDING, DECIDED]
    ContextDecision:
      type: string
      description: DEFER는 공개 승인이 아니며 HELD를 유지한다.
      enum: [CONFIRM_NORMAL, CONFIRM_VIOLATION, DEFER]
    KickDecision:
      type: string
      enum: [APPROVE, REJECT]
    ActionStatus:
      type: string
      description: 실행 상태. 결과 미확인은 Observation으로 구분한다.
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    Observation:
      type: string
      description: UNKNOWN이면 applied=null이고 실패로 단정하지 않는다.
      enum: [CONFIRMED, UNKNOWN]
    ModerationReasonCode:
      type: string
      description: |
        작성자에게 보여 줄 처리 사유(A-3). PASS는 null.
        PROFANITY_INCLUDED: 확실한 욕설 포함으로 숨김. 탐지 단어 자체는 다시 출력하지 않는다.
        LINK_NOT_ALLOWED: 방송 내 링크 전송 금지. 피싱으로 검증했다는 주장을 넣지 않는다.
        FLOOD_REPEATED: 같은 문장 반복(도배).
        CONTEXT_PENDING: 문맥 확인 중(HELD).
        PII_PENDING: 개인정보 확인 중(HELD). 안내에 원문과 탐지 값(전화번호·계좌·이메일 등)을 다시 노출하지 않는다(POLICY §4).
      enum: [PROFANITY_INCLUDED, LINK_NOT_ALLOWED, FLOOD_REPEATED, CONTEXT_PENDING, PII_PENDING]
    PolicyVersion:
      type: string
      description: 활성 정책 버전. v3.1 고정(TBD-08, 환경변수 LIVEGUARD_POLICY_VERSION).
      const: v3.1
    MatchingTag:
      type: string
      description: |
        v1.0 목표 값(ERD §6, E-8)은 UNOFFICIAL_URL을 공식 링크 포함 `LINK`로 바꾸고 `PII_PHONE`·`PII_ACCOUNT`·`PII_EMAIL`을 추가하는 것이다.
        Java enum·필터·계약 테스트와 함께 contracts.enums PR에서 바꾸며, 그 전까지 아래 6종을 유지한다(A-15).
        1차 필터가 걸린 조건. 한 메시지에 여러 개가 붙을 수 있고, filterResult가 같아도 태그로 이유를 구분한다.
        ATTACK_TERM: 공격·비하 사전(애매한 표현, REVIEW).
        CERTAIN_PROFANITY: 확실한 욕설(HOLD).
        OFFICIAL_CLAIM: 공식 주체 자칭. CREDENTIAL_REQUEST: 로그인·인증 요구. UNOFFICIAL_URL: 채널 공식 호스트에 없는 URL.
        (세 태그가 모두 있으면 피싱 HOLD)
        REPEATED_TEXT: 10초 안에 같은 정규화 문장 3회 이상(FLOOD).
      enum: [ATTACK_TERM, CERTAIN_PROFANITY, OFFICIAL_CLAIM, CREDENTIAL_REQUEST, UNOFFICIAL_URL, REPEATED_TEXT]
    CaseStatus:
      type: string
      description: 사건 처리 진행 상태(`cases.status`). 확정 여부는 ConfirmationStatus로 본다. 값 정리는 B2 확인 후(A-8).
      enum: [ANALYZING, NO_ACTION, HIDDEN, NEEDS_REVIEW, KICK_REVIEW_PENDING, CLOSED, FAILED]
    Verdict:
      type: string
      enum: [VIOLATION, NO_VIOLATION, NEEDS_REVIEW]
    Category:
      type: string
      enum: [PROFANITY, HARASSMENT, FLOOD, PHISHING, PII_EXPOSURE]
    KickReviewStatus:
      type: string
      deprecated: true
      description: v0.5 강퇴 검토 상태. ReviewStatus(결정)와 ActionStatus(실행)로 대체됐다. 레거시 KickResultResponse에서만 쓴다(A-12).
      enum: [PENDING, APPROVED, REJECTED, EXECUTED, FAILED]
    ErrorCode:
      type: string
      description: |
        INTERNAL_ERROR: 처리되지 않은 서버 오류. HTTP 500, retryable=false. 응답에 내부 정보는 담지 않는다.
        NOT_IMPLEMENTED: 계약 스텁이며 업무 로직을 실행하지 않는다. HTTP 501, retryable=false.
        KICKED: 이 방송에서 강퇴됨(live ban). HTTP 403, retryable=false. 방송 종료까지 유효하므로 `until`을 보내지 않는다.
        TIMED_OUT: TIMEOUT 중 전송 거부. HTTP 403, retryable=false, `until` = TIMEOUT 만료 시각.
        429를 쓰지 않는다(클라이언트 Recovery가 429를 자동 재시도하므로, A-5).
        LIVE_ENDED: 이미 끝난 방송에 대한 요청. HTTP 409, retryable=false.
        LIVE_ALREADY_ACTIVE: 채널에 진행 중인 방송이 있는데 새 방송 시작. HTTP 409, retryable=false.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - KICKED
        - TIMED_OUT
        - LIVE_ENDED
        - LIVE_ALREADY_ACTIVE
        - NOT_FOUND
        - CASE_NOT_READY
        - STALE_VERSION
        - IDEMPOTENCY_CONFLICT
        - REVIEW_NOT_APPROVED
        - NOT_IMPLEMENTED
        - TEMPORARY_UNAVAILABLE
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            retryable:
              type: boolean
            until:
              $ref: '#/components/schemas/Timestamp'
              description: TIMED_OUT일 때만. TIMEOUT 만료 시각
            currentVersion:
              type: integer
        traceId:
          type: string
          format: uuid
    NotImplementedErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              const: NOT_IMPLEMENTED
            message:
              type: string
            retryable:
              type: boolean
              const: false
        traceId:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Me:
      type: object
      required: [userId, nickname, role, channelIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    MeResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Me'
        traceId:
          type: string

    SendMessageRequest:
      type: object
      required: [clientMessageId, text]
      additionalProperties: false
      properties:
        clientMessageId:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
          minLength: 1
          maxLength: 500
    Live:
      type: object
      required: [liveId, channelId, startedAt, endedAt]
      properties:
        liveId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          description: null이면 방송 중
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    LiveResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Live'
        traceId:
          type: string
    Message:
      type: object
      description: |
        moderationReasonCode·moderationNotice·timeoutUntil·reviewStatus는 작성자 본인에게 보내는 응답에만 채우고,
        다른 사람에게는 null이다. 안내에는 탐지 단어·개인정보 원문을 다시 넣지 않는다.
      required: [messageId, liveId, channelId, authorAlias, text, visibility, version, sentAt, isMine]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
        text:
          type: string
          description: HELD·HIDDEN 원문은 작성자·담당 운영자 응답에만 포함
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Timestamp'
        isMine:
          type: boolean
        moderationReasonCode:
          description: PASS는 null
          oneOf:
            - $ref: '#/components/schemas/ModerationReasonCode'
            - type: 'null'
        moderationNotice:
          type: [string, 'null']
          description: 작성자에게 보여 줄 사유 문장. 예) "메시지에 금지된 욕설이 포함되어 숨김 처리되었습니다."
        timeoutUntil:
          description: 실제 TIMEOUT이 적용됐을 때만. 첫 욕설처럼 TIMEOUT이 없으면 null
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        reviewStatus:
          description: HELD 조사·결정 대기면 PENDING, 그 외 null (A-4)
          oneOf:
            - $ref: '#/components/schemas/ReviewStatus'
            - type: 'null'
    SendMessageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Message'
        traceId:
          type: string
    MessagePageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            nextCursor:
              type: [string, 'null']
        traceId:
          type: string

    PolicySnapshot:
      type: object
      required: [policyId, version, title, text, resourceUri]
      properties:
        policyId:
          type: string
          examples: [CP-2.1]
        version:
          type: string
        title:
          type: string
        text:
          type: string
        resourceUri:
          type: string
          examples: ['policy://0.5/community_policy/CP-2.1']
    CaseSummary:
      type: object
      required: [caseId, liveId, channelId, userAlias, filterResult, handlingRoute, status, confirmationStatus, version, createdAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        handlingRoute:
          $ref: '#/components/schemas/HandlingRoute'
        status:
          $ref: '#/components/schemas/CaseStatus'
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        version:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ContextReview:
      type: object
      description: 문맥 확정 검토. AI 정상 제안(aiVerdict=NO_VIOLATION)이어도 운영자 결정 전까지 PENDING이다.
      required: [reviewId, kind, liveId, caseId, aiVerdict, evidenceVersion, status, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          const: CONTEXT
        liveId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        aiVerdict:
          $ref: '#/components/schemas/Verdict'
        evidenceVersion:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReviewStatus'
        version:
          type: integer
          description: 결정 요청의 expectedReviewVersion과 비교 (reviews.version)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    KickReview:
      type: object
      description: |
        강퇴 승인 검토. basisCaseIds는 심사 요청 때 고정한 기준 사건이며 승인 실행 근거를 새 사건으로 바꾸지 않는다.
        결정 상태(status)와 실제 강퇴 결과(ACTION_APPLIED·ACTION_FAILED)는 따로 본다. 강퇴는 방송 종료까지라 만료 시각이 없다.
      required: [reviewId, kind, liveId, userAlias, basisCaseIds, basisSnapshotId, status, summary, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          const: KICK
        liveId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        summary:
          type: string
          description: Agent가 작성한 검토 요약 (기준 사건의 근거)
        decisionReason:
          type: [string, 'null']
        version:
          type: integer
          description: 결정 요청의 expectedReviewVersion과 비교 (reviews.version)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Review:
      oneOf:
        - $ref: '#/components/schemas/ContextReview'
        - $ref: '#/components/schemas/KickReview'
      discriminator:
        propertyName: kind
        mapping:
          CONTEXT: '#/components/schemas/ContextReview'
          KICK: '#/components/schemas/KickReview'
    ReviewListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        traceId:
          type: string
    Decision:
      type: object
      description: 서버에 저장된 운영자 결정. 재개는 이 decisionId로 업무 DB 저장본을 읽는다.
      required: [decisionId, reviewId, kind, value, operatorId, decidedAt]
      properties:
        decisionId:
          $ref: '#/components/schemas/Uuid'
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ReviewKind'
        value:
          description: kind=CONTEXT면 ContextDecision, kind=KICK이면 KickDecision
          oneOf:
            - $ref: '#/components/schemas/ContextDecision'
            - $ref: '#/components/schemas/KickDecision'
        operatorId:
          $ref: '#/components/schemas/Uuid'
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
    DecisionResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Decision'
        traceId:
          type: string
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          required: [messages, reason, evidenceMessageIds, policySnapshots, violationCount]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            reason:
              type: [string, 'null']
            evidenceMessageIds:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
            policySnapshots:
              type: array
              items:
                $ref: '#/components/schemas/PolicySnapshot'
            violationCount:
              type: integer
              description: 판정 시점의 최근 24시간 누적 위반 사건 수
            kickReview:
              oneOf:
                - $ref: '#/components/schemas/KickReview'
                - type: 'null'
            traceUrl:
              type: [string, 'null']
    CaseListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        traceId:
          type: string
    CaseDetailResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/CaseDetail'
        traceId:
          type: string
    ContextDecisionRequest:
      type: object
      description: CONFIRM_VIOLATION이면 서버가 검증할 categories·evidenceMessageIds가 필수다(A-7). 다른 결정에서는 보내지 않는다.
      required: [clientRequestId, expectedReviewVersion, decision, reason]
      additionalProperties: false
      allOf:
        - if:
            properties: { decision: { const: CONFIRM_VIOLATION } }
            required: [decision]
          then:
            required: [categories, evidenceMessageIds]
          else:
            not:
              anyOf:
                - required: [categories]
                - required: [evidenceMessageIds]
      properties:
        clientRequestId:
          $ref: '#/components/schemas/Uuid'
        expectedReviewVersion:
          type: integer
        decision:
          $ref: '#/components/schemas/ContextDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Category'
        evidenceMessageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickDecisionRequest:
      type: object
      required: [clientRequestId, expectedReviewVersion, decision, reason]
      additionalProperties: false
      properties:
        clientRequestId:
          $ref: '#/components/schemas/Uuid'
        expectedReviewVersion:
          type: integer
        decision:
          $ref: '#/components/schemas/KickDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ----- SSE payload -----
    ChatEvent:
      type: object
      required: [messageId, authorAlias, text, visibility, version, sentAt]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
        text:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    VisibilityChangedEvent:
      type: object
      description: |
        이미 공개됐던 메시지를 가릴 때는 ID만, PUBLIC으로 복원할 때는 text·authorAlias·sentAt 포함.
        복원 이벤트의 sentAt으로 화면의 시간순 자리에 끼워 넣는다.
      required: [messageId, visibility, version]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        text:
          type: string
        authorAlias:
          type: string
        sentAt:
          $ref: '#/components/schemas/Timestamp'
          description: 복원(PUBLIC)일 때만 포함. 원래 전송 시각
    UserKickedEvent:
      type: object
      required: [until]
      properties:
        until:
          $ref: '#/components/schemas/Timestamp'
    CaseEvent:
      type: object
      required: [caseId, status, version]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        version:
          type: integer
    ToolEvent:
      type: object
      required: [caseId, tool, callId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        tool:
          type: string
          examples: [get_chat_context]
        callId:
          type: string
        status:
          type: string
          description: TOOL_END에만
        elapsedMs:
          type: integer
          description: TOOL_END에만
    KickReviewEvent:
      type: object
      required: [reviewId, caseId, status]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/KickReviewStatus'
        kickExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    TaskFailedEvent:
      type: object
      required: [caseId, stage, errorCode]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        stage:
          type: string
        errorCode:
          type: string
        traceUrl:
          type: string

    # ----- Internal -----
    MaskedMessage:
      type: object
      required: [messageId, authorAlias, text, sentAt]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
          examples: [U1]
        text:
          type: string
          description: '[PHONE] [EMAIL] [ACCOUNT] [URL:host] 등으로 마스킹된 본문'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    InternalCase:
      type: object
      description: Current persisted evidence and current target state. Missing required metadata returns CASE_NOT_READY.
      required: [caseId, channelId, liveId, snapshotId, evidenceVersion, policyVersion, handlingRoute, filterResult, matchingTags, version, messages, targets, targetMessageIds, targetVersions]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        evidenceVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        handlingRoute:
          $ref: '#/components/schemas/HandlingRoute'
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        matchingTags:
          type: array
          items:
            $ref: '#/components/schemas/MatchingTag'
        version:
          type: integer
          minimum: 1
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MaskedMessage'
        targets:
          type: array
          minItems: 1
          description: Distinct targets; each messageId must reference a message in this snapshot.
          items:
            $ref: '#/components/schemas/InternalCaseTarget'
        targetMessageIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Derived from targets, in the same order; never supplied independently.
          items:
            $ref: '#/components/schemas/Uuid'
        targetVersions:
          type: object
          description: Derived map of target message UUID to its current version.
          additionalProperties:
            type: integer
            minimum: 1
    InternalCaseTarget:
      type: object
      required: [messageId, visibility, version]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
          minimum: 1
    InternalCaseResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/InternalCase'
        traceId:
          type: string
          format: uuid
    ContextData:
      type: object
      required: [messages, truncated]
      properties:
        messages:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MaskedMessage'
        truncated:
          type: boolean
    ContextResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ContextData'
        traceId:
          type: string
          format: uuid
    UserHistory:
      type: object
      description: TIMEOUT history by category, excluding the current case; consumed kick-review cases remain included.
      required: [violationCount, windowHours, recentCases]
      properties:
        violationCount:
          type: integer
          minimum: 0
          description: Number of distinct cases, not the sum of category counts.
        windowHours:
          type: integer
          minimum: 1
          description: Actual resolved query window; no default or maximum days is established.
        recentCases:
          type: array
          items:
            $ref: '#/components/schemas/UserHistoryRecentCase'
    UserHistoryRecentCase:
      type: object
      required: [caseId, category, judgedAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/Category'
        judgedAt:
          $ref: '#/components/schemas/Timestamp'
    UserHistoryResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/UserHistory'
        traceId:
          type: string
          format: uuid
    ChannelInfo:
      type: object
      required: [officialHosts, events, authorRole, isOfficialOperator, observedLinks]
      properties:
        officialHosts:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/ChannelEventInfo'
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
        observedLinks:
          type: array
          items:
            $ref: '#/components/schemas/ObservedLink'
    ChannelEventInfo:
      type: object
      properties:
        title:
          type: [string, 'null']
        summary:
          type: [string, 'null']
    ObservedLink:
      type: object
      required: [messageId, host, isOfficial]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        host:
          type: string
        isOfficial:
          type: boolean
    ChannelInfoResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelInfo'
        traceId:
          type: string
          format: uuid
    AuthorRole:
      type: string
      enum: [VIEWER, STREAMER, OFFICIAL_STAFF, MODERATOR]
    ChannelUserRole:
      type: object
      required: [authorRole, isOfficialOperator]
      properties:
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
    ChannelUserRoleResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelUserRole'
        traceId:
          type: string
          format: uuid
    SecurityFacts:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items:
            $ref: '#/components/schemas/SecurityFact'
    SecurityFact:
      type: object
      required: [key, value, sourceRefs]
      properties:
        key:
          type: string
          minLength: 1
          description: Nonblank fact key.
        value:
          type: string
          enum: ['TRUE', 'FALSE', UNKNOWN]
        sourceRefs:
          type: array
          description: Required to be non-empty for TRUE/FALSE; UNKNOWN may have no source references.
          items:
            type: string
            minLength: 1
      allOf:
        - if:
            properties:
              value:
                enum: ['TRUE', 'FALSE']
            required: [value]
          then:
            properties:
              sourceRefs:
                minItems: 1
    SecurityFactsResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/SecurityFacts'
        traceId:
          type: string
          format: uuid
    KickEligibility:
      type: object
      description: |
        Distinct confirmed cases for the same user/channel/live across all five categories in the fixed
        24-hour window, including the current case. Revoked and consumed cases are excluded; TIMEOUT
        expiry alone does not revoke a case. Eligibility does not authorize KICK.
      required: [userId, channelId, liveId, asOf, windowHours, violationCount, eligibleCaseIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        asOf:
          $ref: '#/components/schemas/Timestamp'
        windowHours:
          type: integer
          const: 24
        violationCount:
          type: integer
          minimum: 0
          description: Must equal the number of distinct eligibleCaseIds.
        eligibleCaseIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickEligibilityResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickEligibility'
        traceId:
          type: string
          format: uuid
    KickReviewBasis:
      type: object
      description: Fixed approved review basis and consumption ownership; not a new eligibility count.
      required: [reviewId, decisionId, liveId, userId, basisSnapshotId, basisCaseIds, consumptions]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        consumptions:
          type: array
          description: Each consumption caseId must be in basisCaseIds. Only this review/decision may own consumption at revalidation.
          items:
            $ref: '#/components/schemas/KickReviewConsumption'
    KickReviewConsumption:
      type: object
      required: [caseId, reviewId, decisionId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    KickReviewBasisResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickReviewBasis'
        traceId:
          type: string
          format: uuid
    ActionType:
      type: string
      enum: [HIDE, TIMEOUT, RELEASE_HELD, KICK]
    BusinessActionCommand:
      type: object
      description: |
        Backend-issued command. KICK requires review/decision/basis/validation references and at least
        three distinct basisCaseIds. RELEASE_HELD may carry decisionId; other non-KICK commands must
        not carry kick basis references. durationSeconds is positive and required only for TIMEOUT.
      required: [actionId, planId, caseId, liveId, type, targetId, expectedEvidenceVersion, expectedTargetVersion, policyVersion, idempotencyKey]
      additionalProperties: false
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        planId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        targetId:
          $ref: '#/components/schemas/Uuid'
        expectedEvidenceVersion:
          type: integer
          minimum: 1
        expectedTargetVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank.
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
        decisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reviewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisSnapshotId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        validationRef:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisCaseIds:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties:
              type:
                const: TIMEOUT
            required: [type]
          then:
            required: [durationSeconds]
            properties:
              durationSeconds:
                type: integer
                minimum: 1
          else:
            properties:
              durationSeconds:
                type: 'null'
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            required: [decisionId, reviewId, basisSnapshotId, validationRef, basisCaseIds]
            properties:
              decisionId:
                $ref: '#/components/schemas/Uuid'
              reviewId:
                $ref: '#/components/schemas/Uuid'
              basisSnapshotId:
                $ref: '#/components/schemas/Uuid'
              validationRef:
                $ref: '#/components/schemas/Uuid'
              basisCaseIds:
                type: array
                minItems: 3
                uniqueItems: true
          else:
            properties:
              reviewId:
                type: 'null'
              basisSnapshotId:
                type: 'null'
              validationRef:
                type: 'null'
              basisCaseIds:
                anyOf:
                  - type: array
                    maxItems: 0
                  - type: 'null'
        - if:
            properties:
              type:
                enum: [HIDE, TIMEOUT]
            required: [type]
          then:
            properties:
              decisionId:
                type: 'null'
    ReconcileReviewRequest:
      type: object
      required: [caseId, decisionId]
      additionalProperties: false
      description: Body identifiers must match the caseId and decisionId path parameters.
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    ActionExecutionResult:
      type: object
      description: |
        UNKNOWN requires applied=null and a nonterminal PENDING/RUNNING status. CONFIRMED requires
        non-null applied. SUCCEEDED requires applied=true; FAILED requires applied=false.
        retryCount equals max(0, attemptCount - 1). KICK attemptCount is at most 3 and expiresAt is null
        because KICK ends with the live, not a fixed expiry.
      required: [actionId, caseId, liveId, type, status, observation, applied, attemptCount, retryCount, startedAt, expiresAt, errorCode]
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        status:
          $ref: '#/components/schemas/ActionStatus'
        observation:
          $ref: '#/components/schemas/Observation'
        applied:
          type: [boolean, 'null']
        attemptCount:
          type: integer
          minimum: 0
        retryCount:
          type: integer
          minimum: 0
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        errorCode:
          type: [string, 'null']
      allOf:
        - if:
            properties:
              observation:
                const: UNKNOWN
            required: [observation]
          then:
            properties:
              applied:
                type: 'null'
              status:
                enum: [PENDING, RUNNING]
        - if:
            properties:
              observation:
                const: CONFIRMED
            required: [observation]
          then:
            properties:
              applied:
                type: boolean
        - if:
            properties:
              status:
                const: SUCCEEDED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: true
        - if:
            properties:
              status:
                const: FAILED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: false
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            properties:
              attemptCount:
                maximum: 3
              expiresAt:
                type: 'null'
    ActionExecutionResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ActionExecutionResult'
        traceId:
          type: string
          format: uuid
    JudgmentRequest:
      type: object
      description: |
        verdict별 검증 (위반 시 400 VALIDATION_FAILED):
        - VIOLATION: category 필수, evidenceMessageIds 1개 이상, policyIds 1개 이상
        - NEEDS_REVIEW: missingFacts 1개 이상
        - NO_VIOLATION: 추가 필수 항목 없음
      required: [expectedVersion, verdict, evidenceMessageIds, policyIds, reason, traceId]
      additionalProperties: false
      allOf:
        - if:
            properties: { verdict: { const: VIOLATION } }
          then:
            required: [category]
            properties:
              category: { $ref: '#/components/schemas/Category' }
              evidenceMessageIds: { minItems: 1 }
              policyIds: { minItems: 1 }
        - if:
            properties: { verdict: { const: NEEDS_REVIEW } }
          then:
            required: [missingFacts]
            properties:
              missingFacts: { minItems: 1 }
      properties:
        expectedVersion:
          type: integer
        verdict:
          $ref: '#/components/schemas/Verdict'
        category:
          description: VIOLATION이면 필수
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        evidenceMessageIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        policyIds:
          type: array
          description: VIOLATION이면 1개 이상. 서버가 존재·버전을 검증
          items:
            type: string
        policySnapshots:
          type: array
          items:
            $ref: '#/components/schemas/PolicySnapshot'
        reason:
          type: string
        missingFacts:
          type: array
          items:
            type: string
        traceId:
          type: string
    JudgmentResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [caseStatus, violationCount, kickReviewId]
          properties:
            caseStatus:
              $ref: '#/components/schemas/CaseStatus'
            violationCount:
              type: integer
            kickReviewId:
              type: [string, 'null']
              format: uuid
              description: 누적 3회 도달 시 생성된 강퇴 검토 ID. Agent는 이 값이 있으면 interrupt 노드로 간다
        traceId:
          type: string
    KickResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [reviewId, status, startsAt, expiresAt, replayed]
          properties:
            reviewId:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/KickReviewStatus'
            startsAt:
              $ref: '#/components/schemas/Timestamp'
            expiresAt:
              $ref: '#/components/schemas/Timestamp'
            replayed:
              type: boolean
              description: 같은 Idempotency-Key 재요청이면 true
        traceId:
          type: string
    AgentEventRequest:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          enum: [TOOL_START, TOOL_END, TASK_FAILED]
        payload:
          type: object
