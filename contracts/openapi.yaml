    post:
      tags: [Internal]
      operationId: internalRevalidateKickReview
      summary: 강퇴 승인 재검증 (CONTRACTS §8·§9)
      description: |
        저장된 APPROVE 결정과 원 기준 집합(basisCaseIds)을 다시 검증한다. 신규 심사용 집계(소진 제외)를 쓰지 않는다.
        검사: 같은 userId·liveId, 각 기준 사건의 확정 유지·취소 여부·24시간 범위, 소진이 이 review/decision의 것인지,
        정책·증거 버전, 방송 진행 중 여부, 같은 action의 기존 성공 기록.
        통과하면 valid=true와 kick 실행 명령에 넣을 validationRef를 발급한다. 실패하면 valid=false, validationRef=null이며
        실행하지 않는다(후속 상태는 TBD-06). 승인 결정이 없으면 409 REVIEW_NOT_APPROVED.
        kick 재시도 전에도 다시 호출한다.
      x-implementation-status: planned
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '200':
          description: 재검증 결과
          headers:
            X-Trace-Id:
