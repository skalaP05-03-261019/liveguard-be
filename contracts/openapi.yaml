openapi: 3.1.0
info:
  title: LIVE:GUARD API
  version: 1.0.0
  description: |
    1.0.0 계약. 기준은 정책 원본 v3.1(`docs/policy/`), TBD-decisions(OpenAPI v1.0 구현 결정 A-1~A-15), `docs/erd.md` v1.0.
    모든 정책 범위(집계, 도배, 재적발, TIMEOUT, 강퇴)는 `liveId`다. `channelId`는 고정 채널 식별자로만 쓴다.
    활성 정책 버전은 `v3.1` 고정(TBD-08). 사건·판정·action 명령의 `policyVersion`은 이 값과 같아야 한다.
    Java contracts.enums와 로직에 연결되지 않은 DTO는 이 계약에 맞췄다. Message·ChatEvent·VisibilityChangedEvent·
    UserKickedEvent(→ LiveAccessBlockedEvent)·SseEnvelope는 liveId 구현과 함께 맞춘다.

    내부 사건·문맥은 같은 불변 마스킹 snapshot을 읽고 대상 버전은 현재 값을 반환한다.
    사용자 이력은 같은 방송 전체이며 days는 거부한다. 강퇴 후보와 원 결정의 기준/소진 소유권도 읽기 전용으로 구현된다.
    표시된 미지원 legacy/business action은 HTTP 501 `NOT_IMPLEMENTED` (retryable=false)이다.
    사건 필수 정보나 불변 snapshot 미준비는 409 CASE_NOT_READY다. 외부 Agent/RAG 배포 완료를 의미하지 않는다.

    공통 규칙
    - ID와 traceId는 UUID 문자열, 시각은 UTC ISO 8601. JSON은 camelCase.
    - 성공 응답 `{data, traceId}`, 오류 응답 `{error, traceId}`.
    - 브라우저 인증은 같은 출처 세션 쿠키. CSRF는 Spring `CookieCsrfTokenRepository` 기본값을 사용한다
      (`XSRF-TOKEN` 쿠키를 읽어 변경 요청에 `X-XSRF-TOKEN` 헤더로 보냄. axios는 자동 처리).
    - 내부 API(`/internal/**`)는 브라우저에 공개하지 않고 `X-Service-Token`을 검사한다. 누락·오류 시 403.
    - `X-Trace-Id`가 UUID 형식이면 요청 traceId로 재사용하고, 아니면 새 UUID를 생성해 응답 헤더와 응답 envelope에 넣는다.

    MCP 도구 (내부 API를 감싼 어댑터)
    | 서버 | 도구 | 구분 | 내부 API |
    | --- | --- | --- | --- |
    | business-mcp | get_moderation_case | 조건부 구현 | GET /internal/cases/{caseId} |
    | business-mcp | get_chat_context | 구현된 조회 | GET /internal/cases/{caseId}/context |
    | business-mcp | get_channel_info, get_stream_info, get_official_links | 구현된 공유 조회 | GET /internal/cases/{caseId}/channel-info |
    | business-mcp | get_channel_user_role | 구현된 조회 | GET /internal/cases/{caseId}/role |
    | business-mcp | get_security_facts | 통합 사건 UNKNOWN, 출처 미연동 | GET /internal/cases/{caseId}/security-facts |
    | business-mcp | get_user_history | 방송 전체 확정 이력 | GET /internal/cases/{caseId}/user-history |
    | business-mcp | get_kick_eligibility | 예약·소진 제외 조회 | GET /internal/cases/{caseId}/kick-eligibility |
    | business-mcp | get_kick_review_basis | 원 결정의 기준·소진 소유권 | GET /internal/kick-reviews/{reviewId}/basis |
    | business-mcp | (강퇴 재검증) | 구현 | POST /internal/kick-reviews/{reviewId}/revalidate |
    | business-mcp | (판정 제출) | 구현 | POST /internal/cases/{caseId}/judgment |
    | business-mcp | get_action_status | 저장된 live action 조회 | GET /internal/actions/{actionId} |
    | business-mcp | business action | KICK 구현, 그 외 MCP 실행 미지원 | POST /internal/actions/{actionId}/execute |
    | business-mcp | reconcile_review | deprecated 스텁 | POST /internal/cases/{caseId}/reviews/{decisionId}/reconcile |
    | rag-mcp | search_policy | 조회 | (pgvector) |
    | rag-mcp | policy://{version}/{documentId}/{sectionId} | Resource | 정책 원문 |

    `POST /internal/cases/{caseId}/judgment`는 CONTRACTS §5 Agent 출력을 받아 AI 제안과 BE 확정을 구분한다.
    v0.5 레거시 `POST /internal/kick-reviews/{reviewId}/execute`·`GET /internal/cases/{caseId}/history`는 삭제했다(A-12).
    새 action 실행의 canonical 계약은 `/internal/actions/{actionId}/execute`이며 Backend 발급 KICK만 실행한다.
    Judgment의 Agent context 판정은 사람의 결정 전 최종 판정이 아니며 자동 kick을 의미하지 않는다.
    Agent 재개(`POST /agent/tasks/{id}/resume`)는 Agent 저장소 계약이라 이 문서에 넣지 않는다(A-10).

    `x-owner`: B1 = 인증·채팅·채팅 SSE·내부 조회 API, B2 = 사건·판정 처리·강퇴·관제 SSE 발행.
servers:
  - url: /
tags:
  - name: Auth
  - name: Lives
  - name: Messages
  - name: Streams
  - name: Cases
  - name: Reviews
  - name: Internal
    description: Agent·MCP 전용. 브라우저 비공개, 서비스 토큰 필요
security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인 (세션 생성, 세션 ID 회전)
      x-owner: B1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 (세션 종료, 열린 SSE 종료)
      x-owner: B1
      responses:
        '204':
          description: 완료

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 현재 로그인 사용자 (새로고침 시 세션 복원)
      x-owner: B1
      responses:
        '200':
          description: 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/lives:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Lives]
      operationId: startLive
      summary: 방송 시작 (그 채널의 STREAMER 또는 MODERATOR)
      description: |
        새 liveId를 발급한다. 이전 방송의 제재·카운터는 승계하지 않는다.
        채널에 진행 중인 방송이 있으면 409 LIVE_ALREADY_ACTIVE (A-1).
      x-owner: B1
      responses:
        '201':
          description: 방송 시작
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/lives/current:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Lives]
      operationId: getCurrentLive
      summary: 채널의 진행 중 방송 (FE가 liveId를 얻는 곳)
      description: 그 채널의 회원만 조회한다(아니면 403). 진행 중인 방송이 없으면 404 NOT_FOUND (A-2).
      x-owner: B1
      responses:
        '200':
          description: 진행 중 방송
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/lives/{liveId}/end:
    parameters:
      - $ref: '#/components/parameters/LiveId'
    post:
      tags: [Lives]
      operationId: endLive
      summary: 방송 종료 (그 채널의 STREAMER 또는 MODERATOR)
      description: |
        `endedAt`을 기록한다. 이 방송의 live ban 효력이 끝나고 기록은 남는다.
        이미 끝난 방송이면 409 LIVE_ENDED (A-1).
      x-owner: B1
      responses:
        '200':
          description: 방송 종료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/lives/{liveId}/messages:
    parameters:
      - $ref: '#/components/parameters/LiveId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: 채팅 전송
      description: |
        활성 live ban·TIMEOUT 검사 → 같은 clientMessageId 확인 → 저장 → 1차 필터(handlingRoute 1개) → 공개 범위 결정 → SSE 발행.
        차단이면 메시지·사건·도배 카운터를 만들지 않는다.
        - live ban 중: 403 KICKED (until 없음, 방송 종료까지)
        - TIMEOUT 중: 403 TIMED_OUT + until (429 아님)
        - 끝난 방송: 409 LIVE_ENDED
        - 없는 방송: 404 NOT_FOUND
        - 방송 채널의 멤버가 아니면 403 FORBIDDEN
        PASS는 PUBLIC. RULE_CONFIRMED는 HIDDEN. FLOOD_REVIEW·PII_INVESTIGATION·CONTEXT_REVIEW는 HELD(작성자·담당 운영자에게만 보임).
        같은 clientMessageId·같은 text는 최초 응답 반환, 다른 text는 409 IDEMPOTENCY_CONFLICT.
        재전송 확인은 방송 종료 검사보다 먼저 한다. 종료 직전 저장됐는데 응답이 유실된 재전송은 첫 응답을 받는다(A-18).
      x-owner: B1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: 채팅 이력 (이 방송)
      description: 일반 시청자에게는 PUBLIC과 본인의 HELD·HIDDEN만, 담당 운영자에게는 전부 반환한다. 재접속 조회에도 같은 가시성 인가를 적용한다.
      x-owner: B1
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Messages]
      operationId: sendMessageToChannel
      summary: 채팅 전송 (기존 channel 경로)
      deprecated: true
      description: |
        FE 호환용(A-18). `POST /api/lives/{liveId}/messages`로 대체 예정이다.
        서버가 그 채널의 진행 중 방송으로 귀속한다. 진행 중 방송이 없으면 409 LIVE_ENDED.
        그 밖의 검사·응답은 `POST /api/lives/{liveId}/messages`와 같다.
      x-owner: B1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [Messages]
      operationId: listChannelMessages
      summary: 채팅 이력 (기존 channel 경로, 채널 전체)
      deprecated: true
      description: |
        FE 호환용(A-18). 채널의 모든 방송과 방송 도입 전 메시지(liveId=null, A-17)를 함께 반환한다.
        가시성 인가는 `GET /api/lives/{liveId}/messages`와 같다.
      x-owner: B1
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageResponse'
        '403':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/events:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Streams]
      operationId: subscribeChannel
      summary: 채팅 SSE (기존 channel 경로)
      deprecated: true
      description: |
        FE 호환용(A-18). `GET /api/lives/{liveId}/events`(SseEnvelope)로 대체 예정이며, 그 전까지 0.6 형태를 유지한다.
        envelope 없이 data가 payload이고, 이벤트는 CHAT(ChatEvent), MESSAGE_VISIBILITY_CHANGED(복원 시 text·authorAlias·sentAt 포함),
        USER_KICKED(대상 본인)다. HELD·HIDDEN 메시지의 CHAT은 작성자·담당 운영자에게만 보낸다. 15초 heartbeat.
      x-owner: B1
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'

  /api/lives/{liveId}/events:
    parameters:
      - $ref: '#/components/parameters/LiveId'
    get:
      tags: [Streams]
      operationId: subscribeLive
      summary: 채팅 SSE (이 방송)
      description: |
        모든 이벤트의 data는 SseEnvelope이고, x-sse-events는 그 payload schema다.
        - CHAT: HELD·HIDDEN 메시지는 작성자·담당 운영자에게만. HELD 원문을 PUBLIC 이벤트로 먼저 보내지 않는다.
        - MESSAGE_VISIBILITY_CHANGED: messageId·visibility·version만(원문 없음).
        - MESSAGE_RESTORED: 실제 PUBLIC이 된 메시지. sentAt으로 화면의 시간순 자리에 넣는다.
        - LIVE_ACCESS_BLOCKED: 강퇴 대상 본인에게만. 보낸 뒤 서버가 연결을 닫고 권한을 무효화한다(UI만 닫는 방식 아님).
        - ACTION_APPLIED·ACTION_FAILED: 작성자 본인에게 자기 메시지·계정에 대한 실행 결과.
        이 방송에서 live ban 중이면 403 KICKED(재입장 거부), 끝난 방송이면 409 LIVE_ENDED. 15초 heartbeat.
        중복(eventId)과 오래된 entityVersion은 클라이언트가 무시한다.
      x-owner: B1
      x-sse-events:
        CHAT: '#/components/schemas/ChatEvent'
        MESSAGE_VISIBILITY_CHANGED: '#/components/schemas/VisibilityChangedEvent'
        MESSAGE_RESTORED: '#/components/schemas/ChatEvent'
        LIVE_ACCESS_BLOCKED: '#/components/schemas/LiveAccessBlockedEvent'
        ACTION_APPLIED: '#/components/schemas/ActionEvent'
        ACTION_FAILED: '#/components/schemas/ActionEvent'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/guard/events:
    get:
      tags: [Streams]
      operationId: subscribeGuard
      summary: 관제 SSE (담당 운영자)
      description: |
        모든 이벤트의 data는 SseEnvelope이고, x-sse-events는 그 payload schema다.
        TOOL_START·TOOL_END는 Agent 진행 이벤트(평가 항목 "진행 이벤트")로, 원문 인자는 넣지 않는다.
        CONTEXT_REVIEW_REQUIRED와 KICK_REVIEW_REQUIRED는 화면에서 따로 보여 준다.
        REVIEW_DECIDED는 결정 저장을 알릴 뿐이고, 강퇴 완료는 ACTION_APPLIED(type=KICK)로만 표시한다.
        v0.6의 KICK_APPLIED는 ACTION_APPLIED로 대체됐다(A-14).
      x-owner: B1 (연결), B2 (발행)
      x-sse-events:
        CASE_CREATED: '#/components/schemas/CaseEvent'
        CASE_UPDATED: '#/components/schemas/CaseEvent'
        TOOL_START: '#/components/schemas/ToolEvent'
        TOOL_END: '#/components/schemas/ToolEvent'
        TASK_FAILED: '#/components/schemas/TaskFailedEvent'
        CONTEXT_REVIEW_REQUIRED: '#/components/schemas/ContextReviewRequiredEvent'
        KICK_REVIEW_REQUIRED: '#/components/schemas/KickReviewRequiredEvent'
        REVIEW_DECIDED: '#/components/schemas/ReviewDecidedEvent'
        ACTION_APPLIED: '#/components/schemas/ActionEvent'
        ACTION_FAILED: '#/components/schemas/ActionEvent'
      parameters:
        - name: liveId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'

  /api/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: 사건 목록 (담당 운영자)
      description: |
        항목은 사건 상세(CaseDetail)와 같다. 운영 화면이 목록에서 대상 메시지·확정 위반·누적 수를 바로 그리므로
        요약(CaseSummary)으로 줄이지 않는다. 담당 운영자만 호출하므로 HELD·HIDDEN 원문을 포함할 수 있다.
        최신 사건이 먼저다(createdAt 내림차순).
      x-owner: B2
      parameters:
        - name: liveId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: confirmationStatus
          in: query
          schema:
            $ref: '#/components/schemas/ConfirmationStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '400':
          description: VALIDATION_FAILED (confirmationStatus 값이 계약에 없음)
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: CASE_NOT_READY (목록의 한 사건이라도 불변 증거가 현재 사건과 맞지 않음)
          $ref: '#/components/responses/Error'

  /api/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      summary: 사건 상세 (메시지, 판정, 근거, 정책 원문, 강퇴 검토)
      x-owner: B2
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
