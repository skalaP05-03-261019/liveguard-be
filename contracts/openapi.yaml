        summary:
          type: [string, 'null']
    ObservedLink:
      type: object
      required: [messageId, host, isOfficial]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        host:
          type: string
        isOfficial:
          type: boolean
    ChannelInfoResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelInfo'
        traceId:
          type: string
          format: uuid
    AuthorRole:
      type: string
      enum: [VIEWER, STREAMER, OFFICIAL_STAFF, MODERATOR]
    ChannelUserRole:
      type: object
      required: [authorRole, isOfficialOperator]
      properties:
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
    ChannelUserRoleResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelUserRole'
        traceId:
          type: string
          format: uuid
    SecurityFacts:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items:
            $ref: '#/components/schemas/SecurityFact'
    SecurityFact:
      type: object
      required: [key, value, sourceRefs]
      properties:
        key:
          type: string
          minLength: 1
          description: Nonblank fact key.
        value:
          type: string
          enum: ['TRUE', 'FALSE', UNKNOWN]
        sourceRefs:
          type: array
          description: Required to be non-empty for TRUE/FALSE; UNKNOWN may have no source references.
          items:
            type: string
            minLength: 1
      allOf:
        - if:
            properties:
              value:
                enum: ['TRUE', 'FALSE']
            required: [value]
          then:
            properties:
              sourceRefs:
                minItems: 1
    SecurityFactsResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/SecurityFacts'
        traceId:
          type: string
          format: uuid
    KickEligibility:
      type: object
      description: |
        Distinct confirmed cases for the same user/live across all five categories in the fixed
        24-hour window, including the current case. Revoked, consumed and reserved cases are excluded; TIMEOUT
        expiry alone does not revoke a case. Eligibility does not authorize KICK.
        v1.0 목표: violationCount → count(CONTRACTS §3). Java record·계약 테스트와 함께 contracts.enums PR에서 바꾼다(A-13, B2 확인 요청).
      required: [userId, channelId, liveId, asOf, windowHours, violationCount, eligibleCaseIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        asOf:
          $ref: '#/components/schemas/Timestamp'
        windowHours:
          type: integer
          const: 24
        violationCount:
          type: integer
          minimum: 0
          description: Must equal the number of distinct eligibleCaseIds.
        eligibleCaseIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickEligibilityResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickEligibility'
        traceId:
          type: string
          format: uuid
    KickReviewBasis:
      type: object
      description: Fixed approved review basis and consumption ownership; not a new eligibility count.
      required: [reviewId, decisionId, liveId, userId, basisSnapshotId, basisCaseIds, consumptions]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        consumptions:
          type: array
          description: Each consumption caseId must be in basisCaseIds. Only this review/decision may own consumption at revalidation.
          items:
            $ref: '#/components/schemas/KickReviewConsumption'
    KickReviewConsumption:
      type: object
      required: [caseId, reviewId, decisionId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    KickReviewBasisResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickReviewBasis'
        traceId:
          type: string
          format: uuid
    ActionType:
      type: string
      enum: [HIDE, TIMEOUT, RELEASE_HELD, KICK]
    BusinessActionCommand:
      type: object
      description: |
        Backend-issued command. KICK requires review/decision/basis/validation references and at least
        three distinct basisCaseIds. RELEASE_HELD may carry decisionId; other non-KICK commands must
        not carry kick basis references. durationSeconds is positive and required only for TIMEOUT.
      required: [actionId, planId, caseId, liveId, type, targetId, expectedEvidenceVersion, expectedTargetVersion, policyVersion, idempotencyKey]
      additionalProperties: false
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        planId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        targetId:
          $ref: '#/components/schemas/Uuid'
        expectedEvidenceVersion:
          type: integer
          minimum: 1
        expectedTargetVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank.
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
        decisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reviewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisSnapshotId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        validationRef:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisCaseIds:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties:
              type:
                const: TIMEOUT
            required: [type]
          then:
            required: [durationSeconds]
            properties:
              durationSeconds:
                type: integer
                minimum: 1
          else:
            properties:
              durationSeconds:
                type: 'null'
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            required: [decisionId, reviewId, basisSnapshotId, validationRef, basisCaseIds]
            properties:
              decisionId:
                $ref: '#/components/schemas/Uuid'
              reviewId:
                $ref: '#/components/schemas/Uuid'
              basisSnapshotId:
                $ref: '#/components/schemas/Uuid'
              validationRef:
                $ref: '#/components/schemas/Uuid'
              basisCaseIds:
                type: array
                minItems: 3
                uniqueItems: true
          else:
            properties:
              reviewId:
                type: 'null'
              basisSnapshotId:
                type: 'null'
              validationRef:
                type: 'null'
              basisCaseIds:
                anyOf:
                  - type: array
                    maxItems: 0
                  - type: 'null'
        - if:
            properties:
              type:
                enum: [HIDE, TIMEOUT]
            required: [type]
          then:
            properties:
              decisionId:
                type: 'null'
    ReconcileReviewRequest:
      type: object
      required: [caseId, decisionId]
      additionalProperties: false
      description: Body identifiers must match the caseId and decisionId path parameters.
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    ActionExecutionResult:
      type: object
      description: |
        UNKNOWN requires applied=null and a nonterminal PENDING/RUNNING status. CONFIRMED requires
        non-null applied. SUCCEEDED requires applied=true; FAILED requires applied=false.
        retryCount equals max(0, attemptCount - 1). KICK attemptCount is at most 3 and expiresAt is null
        because KICK ends with the live, not a fixed expiry.
      required: [actionId, caseId, liveId, type, status, observation, applied, attemptCount, retryCount, startedAt, expiresAt, errorCode]
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        status:
          $ref: '#/components/schemas/ActionStatus'
        observation:
          $ref: '#/components/schemas/Observation'
        applied:
          type: [boolean, 'null']
        attemptCount:
          type: integer
          minimum: 0
        retryCount:
          type: integer
          minimum: 0
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        errorCode:
          type: [string, 'null']
      allOf:
        - if:
            properties:
              observation:
                const: UNKNOWN
            required: [observation]
          then:
            properties:
              applied:
                type: 'null'
              status:
                enum: [PENDING, RUNNING]
        - if:
            properties:
              observation:
                const: CONFIRMED
            required: [observation]
          then:
            properties:
              applied:
                type: boolean
        - if:
            properties:
              status:
                const: SUCCEEDED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: true
        - if:
            properties:
              status:
                const: FAILED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: false
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            properties:
              attemptCount:
                maximum: 3
              expiresAt:
                type: 'null'
    ActionExecutionResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ActionExecutionResult'
        traceId:
          type: string
          format: uuid
    JudgmentRequest:
      type: object
      description: Agent 출력(CONTRACTS §5). TARGET 메시지마다 messageFindings 하나.
      required: [caseId, liveId, handlingRoute, snapshotId, evidenceVersion, policyVersion, messageFindings]
      additionalProperties: false
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        handlingRoute:
          description: 사건의 handlingRoute와 같아야 한다. AI 조사 경로만 제출한다
          type: string
          enum: [CONTEXT_REVIEW, PII_INVESTIGATION]
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        evidenceVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        messageFindings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageFinding'
    MessageFinding:
      type: object
      description: |
        verdict별 검증 (어기면 400 VALIDATION_FAILED):
        - VIOLATION: categories 1개 이상, policyIds 1개 이상(서버가 존재·버전 검증)
        - NEEDS_REVIEW: missingFacts 1개 이상
        - NO_VIOLATION: categories는 빈 배열
      required: [messageId, verdict, categories, policyIds, reason, missingFacts]
      additionalProperties: false
      allOf:
        - if:
            properties: { verdict: { const: VIOLATION } }
            required: [verdict]
          then:
            properties:
              categories: { minItems: 1 }
              policyIds: { minItems: 1 }
        - if:
            properties: { verdict: { const: NEEDS_REVIEW } }
            required: [verdict]
          then:
            properties:
              missingFacts: { minItems: 1 }
        - if:
            properties: { verdict: { const: NO_VIOLATION } }
            required: [verdict]
          then:
            properties:
              categories: { maxItems: 0 }
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        verdict:
          $ref: '#/components/schemas/Verdict'
        categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Category'
        policyIds:
          type: array
          items:
            type: string
        reason:
          type: string
        missingFacts:
          type: array
          items:
            type: string
    JudgmentResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          description: |
            이 제출로 만들어진 검토(A-9, A-16).
            - CONTEXT_REVIEW: CONTEXT 검토
            - PII_INVESTIGATION + NEEDS_REVIEW(하나라도): CONTEXT 검토. 결정은 POST /api/context-reviews/{reviewId}/decision
            - PII_INVESTIGATION + VIOLATION이 BE 확정돼 강퇴 기준 3건 도달: KICK 검토
            그 외(PII의 NO_VIOLATION, 3건 미만 VIOLATION)는 reviewId·reviewKind 둘 다 null.
            값이 있으면 Agent는 그 reviewId로 interrupt한다.
          required: [confirmationStatus, reviewId, reviewKind]
          properties:
            confirmationStatus:
              $ref: '#/components/schemas/ConfirmationStatus'
            reviewId:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            reviewKind:
              oneOf:
                - $ref: '#/components/schemas/ReviewKind'
                - type: 'null'
        traceId:
          type: string
    KickRevalidation:
      type: object
      required: [reviewId, decisionId, valid, validationRef, basisCaseIds]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        valid:
          type: boolean
        validationRef:
          description: valid=true일 때만. kick 실행 명령(BusinessActionCommand.validationRef)에 넣는다
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisCaseIds:
          type: array
          uniqueItems: true
          description: 검증한 원 기준 집합(새 사건으로 바꾸지 않음)
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties: { valid: { const: false } }
            required: [valid]
          then:
            properties:
              validationRef: { type: 'null' }
    KickRevalidationResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickRevalidation'
        traceId:
          type: string
          format: uuid
    KickResultResponse:
      type: object
      deprecated: true
      description: 레거시 /internal/kick-reviews/{reviewId}/execute 전용(24시간 강퇴). v3.1에 없으며 B2 확인 후 삭제한다(A-12).
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [reviewId, status, startsAt, expiresAt, replayed]
          properties:
            reviewId:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/KickReviewStatus'
            startsAt:
              $ref: '#/components/schemas/Timestamp'
            expiresAt:
              $ref: '#/components/schemas/Timestamp'
            replayed:
              type: boolean
              description: 같은 Idempotency-Key 재요청이면 true
        traceId:
          type: string
    AgentEventRequest:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          enum: [TOOL_START, TOOL_END, TASK_FAILED]
        payload:
          type: object
