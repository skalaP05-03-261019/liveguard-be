          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            reason:
              type: [string, 'null']
            evidenceMessageIds:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
            policySnapshots:
              type: array
              items:
                $ref: '#/components/schemas/PolicySnapshot'
            violationCount:
              type: integer
              description: 판정 시점의 최근 24시간 누적 위반 사건 수
            kickReview:
              oneOf:
                - $ref: '#/components/schemas/KickReview'
