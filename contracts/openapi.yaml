          $ref: '#/components/schemas/Uuid'
        expectedReviewVersion:
          type: integer
        decision:
          $ref: '#/components/schemas/ContextDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Category'
        evidenceMessageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickDecisionRequest:
      type: object
      required: [clientRequestId, expectedReviewVersion, decision, reason]
      additionalProperties: false
      properties:
        clientRequestId:
          $ref: '#/components/schemas/Uuid'
        expectedReviewVersion:
          type: integer
        decision:
          $ref: '#/components/schemas/KickDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500

