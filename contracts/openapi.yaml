openapi: 3.1.0
info:
  title: LIVE:GUARD API
  version: 1.0.0
  description: |
    1.0.0 계약. 기준은 정책 원본 v3.1(`docs/policy/`), TBD-decisions(OpenAPI v1.0 구현 결정 A-1~A-15), `docs/erd.md` v1.0.
    모든 정책 범위(집계, 도배, 재적발, TIMEOUT, 강퇴)는 `liveId`다. `channelId`는 고정 채널 식별자로만 쓴다.
    활성 정책 버전은 `v3.1` 고정(TBD-08). 사건·판정·action 명령의 `policyVersion`은 이 값과 같아야 한다.
    Java enum·DTO는 이 계약에 맞춰 후속 작업에서 바꾼다(contracts.enums PR).

    아래는 0.6.0-draft에서 이어진 구현 상태다. 내부 business-tool 중 `/context`, `/channel-info`, `/role`은 현재 조회 구현이며,
    사건 조회는 필수 메타데이터가 있는 경우, 이력 조회는 명시한 days가 있는 경우에 구현된다.
    나머지 표시된 business-tool 스텁은 HTTP 501 `NOT_IMPLEMENTED` (retryable=false)이다.
    `x-implementation-status: planned`는 미래/레거시 계약일 뿐 현재 구현을 의미하지 않는다.
    사건 필수 정보 미준비는 409 CASE_NOT_READY다. 주변 문맥 snapshot 연결 및 최종 강퇴 자격은 후속 작업이다.

    공통 규칙
    - ID와 traceId는 UUID 문자열, 시각은 UTC ISO 8601. JSON은 camelCase.
    - 성공 응답 `{data, traceId}`, 오류 응답 `{error, traceId}`.
    - 브라우저 인증은 같은 출처 세션 쿠키. CSRF는 Spring `CookieCsrfTokenRepository` 기본값을 사용한다
      (`XSRF-TOKEN` 쿠키를 읽어 변경 요청에 `X-XSRF-TOKEN` 헤더로 보냄. axios는 자동 처리).
    - 내부 API(`/internal/**`)는 브라우저에 공개하지 않고 `X-Service-Token`을 검사한다. 누락·오류 시 403.
    - `X-Trace-Id`가 UUID 형식이면 요청 traceId로 재사용하고, 아니면 새 UUID를 생성해 응답 헤더와 응답 envelope에 넣는다.

    MCP 도구 (내부 API를 감싼 어댑터)
    | 서버 | 도구 | 구분 | 내부 API |
    | --- | --- | --- | --- |
    | business-mcp | get_moderation_case | 조건부 구현 | GET /internal/cases/{caseId} |
    | business-mcp | get_chat_context | 구현된 조회 | GET /internal/cases/{caseId}/context |
    | business-mcp | get_channel_info, get_stream_info, get_official_links | 구현된 공유 조회 | GET /internal/cases/{caseId}/channel-info |
    | business-mcp | get_channel_user_role | 구현된 조회 | GET /internal/cases/{caseId}/role |
    | business-mcp | get_security_facts | 스텁 | GET /internal/cases/{caseId}/security-facts |
    | business-mcp | get_user_history | 명시 기간 조회 구현 | GET /internal/cases/{caseId}/user-history |
    | business-mcp | get_kick_eligibility | 스텁 | GET /internal/cases/{caseId}/kick-eligibility |
    | business-mcp | get_kick_review_basis | 스텁 | GET /internal/kick-reviews/{reviewId}/basis |
    | business-mcp | get_action_status | 스텁 | GET /internal/actions/{actionId} |
    | business-mcp | business action | 스텁 | POST /internal/actions/{actionId}/execute |
    | business-mcp | reconcile_review | deprecated 스텁 | POST /internal/cases/{caseId}/reviews/{decisionId}/reconcile |
    | rag-mcp | search_policy | 조회 | (pgvector) |
    | rag-mcp | policy://{version}/{documentId}/{sectionId} | Resource | 정책 원문 |

    `POST /internal/cases/{caseId}/judgment`와 `POST /internal/kick-reviews/{reviewId}/execute`는 planned legacy 계약이다.
    새 action 실행의 canonical 계약은 `/internal/actions/{actionId}/execute`이며 현재 스텁이다.
    Judgment의 Agent context 판정은 사람의 결정 전 최종 판정이 아니며 자동 kick을 의미하지 않는다.

    `x-owner`: B1 = 인증·채팅·채팅 SSE·내부 조회 API, B2 = 사건·판정 처리·강퇴·관제 SSE 발행.
servers:
  - url: /
tags:
  - name: Auth
  - name: Lives
  - name: Messages
  - name: Streams
  - name: Cases
  - name: Reviews
  - name: Internal
    description: Agent·MCP 전용. 브라우저 비공개, 서비스 토큰 필요
security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인 (세션 생성, 세션 ID 회전)
      x-owner: B1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 (세션 종료, 열린 SSE 종료)
      x-owner: B1
      responses:
        '204':
          description: 완료

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 현재 로그인 사용자 (새로고침 시 세션 복원)
      x-owner: B1
      responses:
        '200':
          description: 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/lives:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Lives]
      operationId: startLive
      summary: 방송 시작 (그 채널의 STREAMER 또는 MODERATOR)
      description: |
        새 liveId를 발급한다. 이전 방송의 제재·카운터는 승계하지 않는다.
        채널에 진행 중인 방송이 있으면 409 LIVE_ALREADY_ACTIVE (A-1).
      x-owner: B1
      responses:
        '201':
          description: 방송 시작
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/lives/current:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Lives]
      operationId: getCurrentLive
      summary: 채널의 진행 중 방송 (FE가 liveId를 얻는 곳)
      description: 진행 중인 방송이 없으면 404 NOT_FOUND (A-2).
      x-owner: B1
      responses:
        '200':
          description: 진행 중 방송
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '404':
          $ref: '#/components/responses/Error'

  /api/lives/{liveId}/end:
    parameters:
      - $ref: '#/components/parameters/LiveId'
    post:
      tags: [Lives]
      operationId: endLive
      summary: 방송 종료 (그 채널의 STREAMER 또는 MODERATOR)
      description: |
        `endedAt`을 기록한다. 이 방송의 live ban 효력이 끝나고 기록은 남는다.
        이미 끝난 방송이면 409 LIVE_ENDED (A-1).
      x-owner: B1
      responses:
        '200':
          description: 방송 종료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/lives/{liveId}/messages:
    parameters:
      - $ref: '#/components/parameters/LiveId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: 채팅 전송
      description: |
        활성 live ban·TIMEOUT 검사 → 같은 clientMessageId 확인 → 저장 → 1차 필터(handlingRoute 1개) → 공개 범위 결정 → SSE 발행.
        차단이면 메시지·사건·도배 카운터를 만들지 않는다.
        - live ban 중: 403 KICKED (until 없음, 방송 종료까지)
        - TIMEOUT 중: 403 TIMED_OUT + until (429 아님)
        - 끝난 방송: 409 LIVE_ENDED
        - 방송 채널의 멤버가 아니면 403 FORBIDDEN
        PASS는 PUBLIC. RULE_CONFIRMED는 HIDDEN. FLOOD_REVIEW·PII_INVESTIGATION·CONTEXT_REVIEW는 HELD(작성자·담당 운영자에게만 보임).
        같은 clientMessageId·같은 text는 최초 응답 반환, 다른 text는 409 IDEMPOTENCY_CONFLICT.
      x-owner: B1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: 채팅 이력 (이 방송)
      description: 일반 시청자에게는 PUBLIC과 본인의 HELD·HIDDEN만, 담당 운영자에게는 전부 반환한다. 재접속 조회에도 같은 가시성 인가를 적용한다.
      x-owner: B1
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageResponse'
        '403':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/events:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Streams]
      operationId: subscribeChannel
      summary: 채팅 SSE
      description: |
        이벤트: CHAT, MESSAGE_VISIBILITY_CHANGED, USER_KICKED(대상 본인에게만).
        HELD·HIDDEN 메시지의 CHAT은 작성자·담당 운영자에게만 보낸다. 15초 heartbeat. 강퇴되면 서버가 연결을 닫는다.
      x-owner: B1
      x-sse-events:
        CHAT: '#/components/schemas/ChatEvent'
        MESSAGE_VISIBILITY_CHANGED: '#/components/schemas/VisibilityChangedEvent'
        USER_KICKED: '#/components/schemas/UserKickedEvent'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'

  /api/guard/events:
    get:
      tags: [Streams]
      operationId: subscribeGuard
      summary: 관제 SSE (담당 운영자)
      description: |
        이벤트: CASE_CREATED, CASE_UPDATED, TOOL_START, TOOL_END, KICK_REVIEW_REQUIRED, KICK_APPLIED, TASK_FAILED.
        TOOL_START·TOOL_END는 Agent 진행 이벤트(평가 항목 "진행 이벤트")로, 원문 인자는 넣지 않는다.
      x-owner: B1 (연결), B2 (발행)
      x-sse-events:
        CASE_CREATED: '#/components/schemas/CaseEvent'
        CASE_UPDATED: '#/components/schemas/CaseEvent'
        TOOL_START: '#/components/schemas/ToolEvent'
        TOOL_END: '#/components/schemas/ToolEvent'
        KICK_REVIEW_REQUIRED: '#/components/schemas/KickReviewEvent'
        KICK_APPLIED: '#/components/schemas/KickReviewEvent'
        TASK_FAILED: '#/components/schemas/TaskFailedEvent'
      parameters:
        - name: channelId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'

  /api/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: 사건 목록 (담당 운영자)
      x-owner: B2
      parameters:
        - name: liveId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: confirmationStatus
          in: query
          schema:
            $ref: '#/components/schemas/ConfirmationStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '403':
          $ref: '#/components/responses/Error'

  /api/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      summary: 사건 상세 (메시지, 판정, 근거, 정책 원문, 강퇴 검토)
      x-owner: B2
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: 검토 목록 (담당 운영자)
      description: |
        kind=CONTEXT는 문맥 확정 검토, kind=KICK은 강퇴 승인 검토. 화면에서 둘을 따로 보여 준다.
        AI 정상 제안이어도 CONTEXT 검토는 결정 전까지 PENDING이다. threadId는 브라우저에 보내지 않는다(A-6).
      x-owner: B2
      parameters:
        - name: liveId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ReviewKind'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReviewStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/context-reviews/{reviewId}/decision:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [Reviews]
      operationId: decideContextReview
      summary: 문맥 검토 결정 (담당 운영자)
      description: |
        CONFIRM_NORMAL: 정상 확정, 이 사건의 hold 원인만 해제(다른 원인이 남아 있으면 HELD 유지).
        CONFIRM_VIOLATION: 위반 확정, categories·evidenceMessageIds 필수(A-7). HIDE와 유형별 TIMEOUT 후 강퇴 집계를 확인한다.
        DEFER: 보류. 최종 확정이 아니며 HELD와 검토 PENDING을 유지하고, 이후 최종 결정을 받을 수 있다.
        결정을 저장한 뒤 Agent의 같은 threadId를 재개한다. 강퇴 승인을 겸하지 않는다.
        같은 clientRequestId 재전송은 저장된 같은 결정을 반환한다. 최종 결정이 저장된 뒤 다른 요청은 409 IDEMPOTENCY_CONFLICT,
        expectedReviewVersion이 다르면 409 STALE_VERSION. 담당 운영자 권한과 liveId 범위를 검사한다.
      x-owner: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextDecisionRequest'
      responses:
        '202':
          description: 결정 저장, 재개 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/kick-reviews/{reviewId}/decision:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [Reviews]
      operationId: decideKickReview
      summary: 강퇴 검토 결정 (운영자)
      description: |
        결정 저장과 기준 사건 소진을 함께 기록하고 Agent의 같은 threadId를 재개한다. 승인·거절 모두 소진한다.
        APPROVE면 Agent가 원 기준을 재검증한 뒤 kick_user를 실행한다. 결정 저장 성공은 강퇴 성공이 아니며,
        결과는 ACTION_APPLIED·ACTION_FAILED로 따로 알린다. REJECT면 강퇴 없이 끝나고 HIDE·TIMEOUT은 유지한다.
        같은 clientRequestId 재전송은 저장된 같은 결정을 반환한다. 이미 결정된 검토에 다른 요청은 409 IDEMPOTENCY_CONFLICT,
        expectedReviewVersion이 다르면 409 STALE_VERSION.
      x-owner: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KickDecisionRequest'
      responses:
        '202':
          description: 결정 저장, 재개 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetCase
      summary: get_moderation_case
      description: |
        Persistence-backed current case evidence and current target versions, read in one consistent transaction.
        Missing case returns 404. Missing broadcast/policy/route, current evidence or targets returns
        409 CASE_NOT_READY (retryable=false); metadata is never fabricated.
        targets is canonical; targetMessageIds and targetVersions are derived compatibility projections.
        This is not an immutable historical chat-context snapshot.
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '200':
          description: Current case evidence and targets.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalCaseResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/context:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetContext
      summary: get_chat_context
      description: |
        Implemented Backend query of masked case messages and surrounding chat; response has at most 20 messages.
        before and after each default to 10 and must be between 0 and 10. Missing case message is 404.
        Optional deprecated view accepts only `chatContext`; any other value is 400.
        Snapshot/evidence version and message visibility enrichment required by the Agent loader
        is deferred; this response alone does not satisfy the complete Agent context contract.
      x-owner: B1
      x-implementation-status: implemented
      security:
        - serviceToken: []
      parameters:
        - name: before
          in: query
          required: false
          description: Number of preceding messages; range 0..10.
          schema:
            type: integer
            minimum: 0
            default: 10
            maximum: 10
        - name: after
          in: query
          required: false
          description: Number of following messages; range 0..10.
          schema:
            type: integer
            minimum: 0
            default: 10
            maximum: 10
        - name: view
          in: query
          required: false
          deprecated: true
          description: Legacy compatibility parameter. Only `chatContext` is accepted; all other values return 400.
          schema:
            type: string
            enum: [chatContext]
      responses:
        '200':
          description: 전후 채팅 최대 20건 (마스킹)
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/user-history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetUserHistory
      summary: get_user_history
      description: |
        TIMEOUT history by category, excluding the current case. Only current, unrevoked Backend
        confirmed VIOLATION findings count; proposals and NO_VIOLATION/NEEDS_REVIEW do not.
        Consumed kick-review cases and expired TIMEOUTs remain in history.
        Explicit positive days selects [server time - days, server time], inclusive by case occurrence time;
        confirmations after the upper bound are excluded. This reads current revocation state, not historical replay.
        violationCount counts distinct cases; recentCases contains one row per case/category.
        No default policy period is approved: omitted days returns 501 for an existing case.
        days * 24 must fit windowHours (integer); overflow returns 400, not a policy duration limit.
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      parameters:
        - name: days
          in: query
          required: false
          description: Optional positive requested range; no default or maximum is established.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Explicit-period confirmed history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHistoryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetUserHistoryLegacy
      summary: Legacy user-history alias
      description: Deprecated alias with the same TIMEOUT-only, excludes-current-case semantics as `/user-history`.
      deprecated: true
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      parameters:
        - name: days
          in: query
          required: false
          description: Optional positive requested range; no default or maximum is established.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Same explicit-period history as /user-history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHistoryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/kick-eligibility:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetKickEligibility
      summary: get_kick_eligibility
      description: |
        Contract stub (501). Fixed 24-hour window includes the current confirmed case and distinct
        confirmed cases across all five categories. Excludes revoked and consumed cases, but not cases
        whose TIMEOUT has expired. Eligibility is not approval or permission to execute KICK.
        A supplied `days` parameter is unsupported and returns 400.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      parameters:
        - name: days
          in: query
          required: false
          deprecated: true
          description: Unsupported; supplying this parameter returns 400 because the window is fixed at 24 hours.
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/channel-info:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetChannelInfo
      summary: get_channel_info
      description: |
        Implemented shared source for get_stream_info and get_official_links. Returns registered official
        hosts/events, observed link hosts, and the author's current channel role. Not live lifecycle data
        or verified PII facts. An official host does not exempt a link from link-prohibition rules.
      x-implementation-status: implemented
      x-owner: B1
      security:
        - serviceToken: []
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelInfoResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/role:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetChannelUserRole
      summary: get_channel_user_role
      description: Implemented query of the current case author's channel role; this is not historical or verified identity.
      x-implementation-status: implemented
      x-owner: B1
      security:
        - serviceToken: []
      responses:
        '200':
          description: Current role
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelUserRoleResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/security-facts:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetSecurityFacts
      summary: get_security_facts
      description: Contract stub (501). TRUE/FALSE facts require source references; unresolved facts are UNKNOWN. Channel metadata alone is not proof of PII.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/judgment:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalSubmitJudgment
      summary: Planned legacy judgment contract (Agent server → Backend)
      description: |
        Planned only; not implemented. An Agent context assessment is not a final judgment before the
        human decision and does not automatically kick a user. Do not infer action or review behavior from this contract.
      x-implementation-status: planned
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgmentRequest'
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/kick-reviews/{reviewId}/execute:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalExecuteKick
      summary: Planned legacy kick execution contract
      description: |
        Planned, unimplemented legacy contract. Legacy kick execution is pending consolidation with
        canonical `POST /internal/actions/{actionId}/execute`; this path does not imply kick execution.
      x-owner: B2
      x-implementation-status: planned
      security:
        - serviceToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            examples: ['kick:review-uuid']
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/kick-reviews/{reviewId}/basis:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetKickReviewBasis
      summary: get_kick_review_basis
      description: |
        Contract stub (501). Returns the fixed approved review basis and consumption ownership, not a
        new eligibility count. During revalidation only this review/decision's consumption is permitted;
        another review's consumption blocks execution. This read does not approve a review or issue validationRef.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/actions/{actionId}:
    parameters:
      - $ref: '#/components/parameters/ActionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetActionStatus
      summary: get_action_status
      description: Contract stub (501); reads action status only and does not execute an action.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/actions/{actionId}/execute:
    parameters:
      - $ref: '#/components/parameters/ActionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalExecuteAction
      summary: Execute a Backend-issued action command
      description: |
        Contract stub (501). Canonical action command for HIDE, TIMEOUT, RELEASE_HELD, and KICK.
        The path actionId must match the body. Future execution must revalidate versions, policy,
        permissions, idempotency, and (for KICK) approval/basis. UNKNOWN observations are nonterminal.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessActionCommand'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/reviews/{decisionId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/DecisionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalReconcileReview
      summary: Legacy reconcile_review contract
      description: |
        Deprecated contract stub (501); not the CONTEXT/KICK decision or resume API.
        Does not approve KICK, unconsume cases, or automatically undo existing HIDE/TIMEOUT actions.
        Body caseId and decisionId must match the path.
      deprecated: true
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileReviewRequest'
