openapi: 3.1.0
info:
  title: LIVE:GUARD API
  version: 0.6.0-draft
  description: |
    0.6.0-draft 계약. 내부 business-tool 중 `/context`, `/channel-info`, `/role`은 현재 조회 구현이며,
    사건 조회는 필수 메타데이터가 있는 경우, 이력 조회는 명시한 days가 있는 경우에 구현된다.
    나머지 표시된 business-tool 스텁은 HTTP 501 `NOT_IMPLEMENTED` (retryable=false)이다.
    `x-implementation-status: planned`는 미래/레거시 계약일 뿐 현재 구현을 의미하지 않는다.
    사건 필수 정보 미준비는 409 CASE_NOT_READY다. 주변 문맥 snapshot 연결 및 최종 강퇴 자격은 후속 작업이다.

    공통 규칙
    - ID와 traceId는 UUID 문자열, 시각은 UTC ISO 8601. JSON은 camelCase.
    - 성공 응답 `{data, traceId}`, 오류 응답 `{error, traceId}`.
    - 브라우저 인증은 같은 출처 세션 쿠키. CSRF는 Spring `CookieCsrfTokenRepository` 기본값을 사용한다
      (`XSRF-TOKEN` 쿠키를 읽어 변경 요청에 `X-XSRF-TOKEN` 헤더로 보냄. axios는 자동 처리).
    - 내부 API(`/internal/**`)는 브라우저에 공개하지 않고 `X-Service-Token`을 검사한다. 누락·오류 시 403.
    - `X-Trace-Id`가 UUID 형식이면 요청 traceId로 재사용하고, 아니면 새 UUID를 생성해 응답 헤더와 응답 envelope에 넣는다.

    MCP 도구 (내부 API를 감싼 어댑터)
    | 서버 | 도구 | 구분 | 내부 API |
    | --- | --- | --- | --- |
    | business-mcp | get_moderation_case | 조건부 구현 | GET /internal/cases/{caseId} |
    | business-mcp | get_chat_context | 구현된 조회 | GET /internal/cases/{caseId}/context |
    | business-mcp | get_channel_info, get_stream_info, get_official_links | 구현된 공유 조회 | GET /internal/cases/{caseId}/channel-info |
    | business-mcp | get_channel_user_role | 구현된 조회 | GET /internal/cases/{caseId}/role |
    | business-mcp | get_security_facts | 스텁 | GET /internal/cases/{caseId}/security-facts |
    | business-mcp | get_user_history | 명시 기간 조회 구현 | GET /internal/cases/{caseId}/user-history |
    | business-mcp | get_kick_eligibility | 스텁 | GET /internal/cases/{caseId}/kick-eligibility |
    | business-mcp | get_kick_review_basis | 스텁 | GET /internal/kick-reviews/{reviewId}/basis |
    | business-mcp | get_action_status | 스텁 | GET /internal/actions/{actionId} |
    | business-mcp | business action | 스텁 | POST /internal/actions/{actionId}/execute |
    | business-mcp | reconcile_review | deprecated 스텁 | POST /internal/cases/{caseId}/reviews/{decisionId}/reconcile |
    | rag-mcp | search_policy | 조회 | (pgvector) |
    | rag-mcp | policy://{version}/{documentId}/{sectionId} | Resource | 정책 원문 |

    `POST /internal/cases/{caseId}/judgment`와 `POST /internal/kick-reviews/{reviewId}/execute`는 planned legacy 계약이다.
    새 action 실행의 canonical 계약은 `/internal/actions/{actionId}/execute`이며 현재 스텁이다.
    Judgment의 Agent context 판정은 사람의 결정 전 최종 판정이 아니며 자동 kick을 의미하지 않는다.

    `x-owner`: B1 = 인증·채팅·채팅 SSE·내부 조회 API, B2 = 사건·판정 처리·강퇴·관제 SSE 발행.
servers:
  - url: /
tags:
  - name: Auth
  - name: Messages
  - name: Streams
  - name: Cases
  - name: KickReviews
  - name: Internal
    description: Agent·MCP 전용. 브라우저 비공개, 서비스 토큰 필요
security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인 (세션 생성, 세션 ID 회전)
      x-owner: B1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 (세션 종료, 열린 SSE 종료)
      x-owner: B1
      responses:
        '204':
          description: 완료

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 현재 로그인 사용자 (새로고침 시 세션 복원)
      x-owner: B1
      responses:
        '200':
          description: 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: 채팅 전송
      description: |
        저장 → 1차 필터 → 공개 범위 결정 → SSE 발행. HOLD·FLOOD는 즉시 HELD(작성자·운영자에게만 보임).
        같은 clientMessageId·같은 text는 최초 응답 반환, 다른 text는 409. 강퇴 중이면 403 KICKED + until.
      x-owner: B1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: 채팅 이력
      description: 일반 시청자에게는 PUBLIC과 본인의 HELD·HIDDEN만, 담당 운영자에게는 전부 반환한다.
      x-owner: B1
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageResponse'
        '403':
          $ref: '#/components/responses/Error'

  /api/channels/{channelId}/events:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Streams]
      operationId: subscribeChannel
      summary: 채팅 SSE
      description: |
        이벤트: CHAT, MESSAGE_VISIBILITY_CHANGED, USER_KICKED(대상 본인에게만).
        HELD·HIDDEN 메시지의 CHAT은 작성자·담당 운영자에게만 보낸다. 15초 heartbeat. 강퇴되면 서버가 연결을 닫는다.
      x-owner: B1
      x-sse-events:
        CHAT: '#/components/schemas/ChatEvent'
        MESSAGE_VISIBILITY_CHANGED: '#/components/schemas/VisibilityChangedEvent'
        USER_KICKED: '#/components/schemas/UserKickedEvent'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'

  /api/guard/events:
    get:
      tags: [Streams]
      operationId: subscribeGuard
      summary: 관제 SSE (담당 운영자)
      description: |
        이벤트: CASE_CREATED, CASE_UPDATED, TOOL_START, TOOL_END, KICK_REVIEW_REQUIRED, KICK_APPLIED, TASK_FAILED.
        TOOL_START·TOOL_END는 Agent 진행 이벤트(평가 항목 "진행 이벤트")로, 원문 인자는 넣지 않는다.
      x-owner: B1 (연결), B2 (발행)
      x-sse-events:
        CASE_CREATED: '#/components/schemas/CaseEvent'
        CASE_UPDATED: '#/components/schemas/CaseEvent'
        TOOL_START: '#/components/schemas/ToolEvent'
        TOOL_END: '#/components/schemas/ToolEvent'
        KICK_REVIEW_REQUIRED: '#/components/schemas/KickReviewEvent'
        KICK_APPLIED: '#/components/schemas/KickReviewEvent'
        TASK_FAILED: '#/components/schemas/TaskFailedEvent'
      parameters:
        - name: channelId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '403':
          $ref: '#/components/responses/Error'

  /api/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: 사건 목록 (담당 운영자)
      x-owner: B2
      parameters:
        - name: channelId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '403':
          $ref: '#/components/responses/Error'

  /api/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      summary: 사건 상세 (메시지, 판정, 근거, 정책 원문, 강퇴 검토)
      x-owner: B2
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/cases/{caseId}/release:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: releaseCase
      summary: 오탐 해제 (운영자)
      description: 사건 메시지를 PUBLIC으로 복원하고 누적 횟수에서 제외한다. 사람이 직접 하는 Backend 기능이며 Agent 도구가 아니다.
      x-owner: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: 해제 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryResponse'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/kick-reviews/{reviewId}/decision:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [KickReviews]
      operationId: decideKickReview
      summary: 강퇴 검토 결정 (운영자)
      description: |
        결정을 저장하고 Agent의 같은 thread를 재개하는 작업을 보낸다.
        APPROVE면 Agent가 kick_user를 실행하고 KICK_APPLIED를 보낸다. REJECT면 강퇴 없이 종료하고 가림은 유지한다.
      x-owner: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KickDecisionRequest'
      responses:
        '202':
          description: 결정 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KickReviewResponse'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetCase
      summary: get_moderation_case
      description: |
        Persistence-backed current case evidence and current target versions, read in one consistent transaction.
        Missing case returns 404. Missing broadcast/policy/route, current evidence or targets returns
        409 CASE_NOT_READY (retryable=false); metadata is never fabricated.
        targets is canonical; targetMessageIds and targetVersions are derived compatibility projections.
        This is not an immutable historical chat-context snapshot.
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '200':
          description: Current case evidence and targets.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalCaseResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/context:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetContext
      summary: get_chat_context
      description: |
        Implemented Backend query of masked case messages and surrounding chat; response has at most 20 messages.
        before and after each default to 10 and must be between 0 and 10. Missing case message is 404.
        Optional deprecated view accepts only `chatContext`; any other value is 400.
        Snapshot/evidence version and message visibility enrichment required by the Agent loader
        is deferred; this response alone does not satisfy the complete Agent context contract.
      x-owner: B1
      x-implementation-status: implemented
      security:
        - serviceToken: []
      parameters:
        - name: before
          in: query
          required: false
          description: Number of preceding messages; range 0..10.
          schema:
            type: integer
            minimum: 0
            default: 10
            maximum: 10
        - name: after
          in: query
          required: false
          description: Number of following messages; range 0..10.
          schema:
            type: integer
            minimum: 0
            default: 10
            maximum: 10
        - name: view
          in: query
          required: false
          deprecated: true
          description: Legacy compatibility parameter. Only `chatContext` is accepted; all other values return 400.
          schema:
            type: string
            enum: [chatContext]
      responses:
        '200':
          description: 전후 채팅 최대 20건 (마스킹)
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/user-history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetUserHistory
      summary: get_user_history
      description: |
        TIMEOUT history by category, excluding the current case. Only current, unrevoked Backend
        confirmed VIOLATION findings count; proposals and NO_VIOLATION/NEEDS_REVIEW do not.
        Consumed kick-review cases and expired TIMEOUTs remain in history.
        Explicit positive days selects [server time - days, server time], inclusive by case occurrence time;
        confirmations after the upper bound are excluded. This reads current revocation state, not historical replay.
        violationCount counts distinct cases; recentCases contains one row per case/category.
        No default policy period is approved: omitted days returns 501 for an existing case.
        days * 24 must fit windowHours (integer); overflow returns 400, not a policy duration limit.
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      parameters:
        - name: days
          in: query
          required: false
          description: Optional positive requested range; no default or maximum is established.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Explicit-period confirmed history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHistoryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetUserHistoryLegacy
      summary: Legacy user-history alias
      description: Deprecated alias with the same TIMEOUT-only, excludes-current-case semantics as `/user-history`.
      deprecated: true
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      parameters:
        - name: days
          in: query
          required: false
          description: Optional positive requested range; no default or maximum is established.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Same explicit-period history as /user-history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHistoryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/kick-eligibility:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetKickEligibility
      summary: get_kick_eligibility
      description: |
        Contract stub (501). Fixed 24-hour window includes the current confirmed case and distinct
        confirmed cases across all five categories. Excludes revoked and consumed cases, but not cases
        whose TIMEOUT has expired. Eligibility is not approval or permission to execute KICK.
        A supplied `days` parameter is unsupported and returns 400.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      parameters:
        - name: days
          in: query
          required: false
          deprecated: true
          description: Unsupported; supplying this parameter returns 400 because the window is fixed at 24 hours.
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/channel-info:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetChannelInfo
      summary: get_channel_info
      description: |
        Implemented shared source for get_stream_info and get_official_links. Returns registered official
        hosts/events, observed link hosts, and the author's current channel role. Not live lifecycle data
        or verified PII facts. An official host does not exempt a link from link-prohibition rules.
      x-implementation-status: implemented
      x-owner: B1
      security:
        - serviceToken: []
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelInfoResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/role:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetChannelUserRole
      summary: get_channel_user_role
      description: Implemented query of the current case author's channel role; this is not historical or verified identity.
      x-implementation-status: implemented
      x-owner: B1
      security:
        - serviceToken: []
      responses:
        '200':
          description: Current role
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelUserRoleResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/cases/{caseId}/security-facts:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetSecurityFacts
      summary: get_security_facts
      description: Contract stub (501). TRUE/FALSE facts require source references; unresolved facts are UNKNOWN. Channel metadata alone is not proof of PII.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/judgment:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalSubmitJudgment
      summary: Planned legacy judgment contract (Agent server → Backend)
      description: |
        Planned only; not implemented. An Agent context assessment is not a final judgment before the
        human decision and does not automatically kick a user. Do not infer action or review behavior from this contract.
      x-implementation-status: planned
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgmentRequest'
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/kick-reviews/{reviewId}/execute:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalExecuteKick
      summary: Planned legacy kick execution contract
      description: |
        Planned, unimplemented legacy contract. Legacy kick execution is pending consolidation with
        canonical `POST /internal/actions/{actionId}/execute`; this path does not imply kick execution.
      x-owner: B2
      x-implementation-status: planned
      security:
        - serviceToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            examples: ['kick:review-uuid']
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/kick-reviews/{reviewId}/basis:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetKickReviewBasis
      summary: get_kick_review_basis
      description: |
        Contract stub (501). Returns the fixed approved review basis and consumption ownership, not a
        new eligibility count. During revalidation only this review/decision's consumption is permitted;
        another review's consumption blocks execution. This read does not approve a review or issue validationRef.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/actions/{actionId}:
    parameters:
      - $ref: '#/components/parameters/ActionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    get:
      tags: [Internal]
      operationId: internalGetActionStatus
      summary: get_action_status
      description: Contract stub (501); reads action status only and does not execute an action.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/actions/{actionId}/execute:
    parameters:
      - $ref: '#/components/parameters/ActionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalExecuteAction
      summary: Execute a Backend-issued action command
      description: |
        Contract stub (501). Canonical action command for HIDE, TIMEOUT, RELEASE_HELD, and KICK.
        The path actionId must match the body. Future execution must revalidate versions, policy,
        permissions, idempotency, and (for KICK) approval/basis. UNKNOWN observations are nonterminal.
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessActionCommand'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/reviews/{decisionId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/DecisionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalReconcileReview
      summary: Legacy reconcile_review contract
      description: |
        Deprecated contract stub (501); not the CONTEXT/KICK decision or resume API.
        Does not approve KICK, unconsume cases, or automatically undo existing HIDE/TIMEOUT actions.
        Body caseId and decisionId must match the path.
      deprecated: true
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileReviewRequest'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/events:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalPostEvent
      summary: Agent 진행 이벤트 수신 → 관제 SSE 중계
      x-owner: B1
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEventRequest'
      responses:
        '202':
          description: 중계 완료
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: UUID is reused; any non-UUID value is ignored and replaced with a generated UUID.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  responses:
    Error:
      description: 오류
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: Contract stub; no business operation was executed. Error code NOT_IMPLEMENTED, retryable=false.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotImplementedErrorResponse'
    EventStream:
      description: SSE. 각 이벤트는 `id`, `event`, `data`(JSON)로 구성된다.
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            id: 42
            event: MESSAGE_VISIBILITY_CHANGED
            data: {"messageId":"33333333-3333-4333-8333-333333333333","visibility":"HIDDEN","version":2}

            : ping

  headers:
    TraceId:
      description: UUID trace identifier reused from a valid request header or generated by the server.
      schema:
        type: string
        format: uuid

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Role:
      type: string
      enum: [VIEWER, MODERATOR, PLATFORM_ADMIN]
    Visibility:
      type: string
      enum: [PUBLIC, HELD, HIDDEN]
    FilterResult:
      type: string
      enum: [PASS, REVIEW, HOLD, FLOOD]
    MatchingTag:
      type: string
      description: |
        1차 필터가 걸린 조건. 한 메시지에 여러 개가 붙을 수 있고, filterResult가 같아도 태그로 이유를 구분한다.
        ATTACK_TERM: 공격·비하 사전(애매한 표현, REVIEW).
        CERTAIN_PROFANITY: 확실한 욕설(HOLD).
        OFFICIAL_CLAIM: 공식 주체 자칭. CREDENTIAL_REQUEST: 로그인·인증 요구. UNOFFICIAL_URL: 채널 공식 호스트에 없는 URL.
        (세 태그가 모두 있으면 피싱 HOLD)
        REPEATED_TEXT: 10초 안에 같은 정규화 문장 3회 이상(FLOOD).
      enum: [ATTACK_TERM, CERTAIN_PROFANITY, OFFICIAL_CLAIM, CREDENTIAL_REQUEST, UNOFFICIAL_URL, REPEATED_TEXT]
    CaseStatus:
      type: string
      enum: [ANALYZING, NO_ACTION, HIDDEN, NEEDS_REVIEW, KICK_REVIEW_PENDING, CLOSED, FAILED]
    Verdict:
      type: string
      enum: [VIOLATION, NO_VIOLATION, NEEDS_REVIEW]
    Category:
      type: string
      enum: [PROFANITY, HARASSMENT, FLOOD, PHISHING, PII_EXPOSURE]
    KickReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXECUTED, FAILED]
    ErrorCode:
      type: string
      description: |
        INTERNAL_ERROR: 처리되지 않은 서버 오류. HTTP 500, retryable=false. 응답에 내부 정보는 담지 않는다.
        NOT_IMPLEMENTED: 계약 스텁이며 업무 로직을 실행하지 않는다. HTTP 501, retryable=false.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - KICKED
        - NOT_FOUND
        - CASE_NOT_READY
        - STALE_VERSION
        - IDEMPOTENCY_CONFLICT
        - REVIEW_NOT_APPROVED
        - NOT_IMPLEMENTED
        - TEMPORARY_UNAVAILABLE
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            retryable:
              type: boolean
            until:
              $ref: '#/components/schemas/Timestamp'
            currentVersion:
              type: integer
        traceId:
          type: string
          format: uuid
    NotImplementedErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              const: NOT_IMPLEMENTED
            message:
              type: string
            retryable:
              type: boolean
              const: false
        traceId:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Me:
      type: object
      required: [userId, nickname, role, channelIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    MeResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Me'
        traceId:
          type: string

    SendMessageRequest:
      type: object
      required: [clientMessageId, text]
      additionalProperties: false
      properties:
        clientMessageId:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
          minLength: 1
          maxLength: 500
    Message:
      type: object
      required: [messageId, channelId, authorAlias, text, visibility, version, sentAt, isMine]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
        text:
          type: string
          description: HELD·HIDDEN 원문은 작성자·담당 운영자 응답에만 포함
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Timestamp'
        isMine:
          type: boolean
    SendMessageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Message'
        traceId:
          type: string
    MessagePageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            nextCursor:
              type: [string, 'null']
        traceId:
          type: string

    PolicySnapshot:
      type: object
      required: [policyId, version, title, text, resourceUri]
      properties:
        policyId:
          type: string
          examples: [CP-2.1]
        version:
          type: string
        title:
          type: string
        text:
          type: string
        resourceUri:
          type: string
          examples: ['policy://0.5/community_policy/CP-2.1']
    CaseSummary:
      type: object
      required: [caseId, channelId, userAlias, filterResult, status, version, createdAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        status:
          $ref: '#/components/schemas/CaseStatus'
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        version:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    KickReview:
      type: object
      required: [reviewId, channelId, userAlias, status, summary, caseIds, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        status:
          $ref: '#/components/schemas/KickReviewStatus'
        summary:
          type: string
          description: Agent가 작성한 검토 요약 (위반 3건의 근거)
        caseIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        decisionReason:
          type: [string, 'null']
        kickExpiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        version:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          required: [messages, reason, evidenceMessageIds, policySnapshots, violationCount]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            reason:
              type: [string, 'null']
            evidenceMessageIds:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
            policySnapshots:
              type: array
              items:
                $ref: '#/components/schemas/PolicySnapshot'
            violationCount:
              type: integer
              description: 판정 시점의 최근 24시간 누적 위반 사건 수
            kickReview:
              oneOf:
                - $ref: '#/components/schemas/KickReview'
                - type: 'null'
            traceUrl:
              type: [string, 'null']
    CaseListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        traceId:
          type: string
    CaseSummaryResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/CaseSummary'
        traceId:
          type: string
    CaseDetailResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/CaseDetail'
        traceId:
          type: string
    ReleaseRequest:
      type: object
      required: [expectedVersion, reason]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
        reason:
          type: string
          minLength: 1
          maxLength: 500
    KickDecisionRequest:
      type: object
      required: [decision, reason, expectedVersion, clientRequestId]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedVersion:
          type: integer
        clientRequestId:
          $ref: '#/components/schemas/Uuid'
    KickReviewResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickReview'
        traceId:
          type: string

    # ----- SSE payload -----
    ChatEvent:
      type: object
      required: [messageId, authorAlias, text, visibility, version, sentAt]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
        text:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    VisibilityChangedEvent:
      type: object
      description: |
        이미 공개됐던 메시지를 가릴 때는 ID만, PUBLIC으로 복원할 때는 text·authorAlias·sentAt 포함.
        복원 이벤트의 sentAt으로 화면의 시간순 자리에 끼워 넣는다.
      required: [messageId, visibility, version]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        text:
          type: string
        authorAlias:
          type: string
        sentAt:
          $ref: '#/components/schemas/Timestamp'
          description: 복원(PUBLIC)일 때만 포함. 원래 전송 시각
    UserKickedEvent:
      type: object
      required: [until]
      properties:
        until:
          $ref: '#/components/schemas/Timestamp'
    CaseEvent:
      type: object
      required: [caseId, status, version]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        version:
          type: integer
    ToolEvent:
      type: object
      required: [caseId, tool, callId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        tool:
          type: string
          examples: [get_chat_context]
        callId:
          type: string
        status:
          type: string
          description: TOOL_END에만
        elapsedMs:
          type: integer
          description: TOOL_END에만
    KickReviewEvent:
      type: object
      required: [reviewId, caseId, status]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/KickReviewStatus'
        kickExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    TaskFailedEvent:
      type: object
      required: [caseId, stage, errorCode]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        stage:
          type: string
        errorCode:
          type: string
        traceUrl:
          type: string

    # ----- Internal -----
    MaskedMessage:
      type: object
      required: [messageId, authorAlias, text, sentAt]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
          examples: [U1]
        text:
          type: string
          description: '[PHONE] [EMAIL] [ACCOUNT] [URL:host] 등으로 마스킹된 본문'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    InternalCase:
      type: object
      description: Current persisted evidence and current target state. Missing required metadata returns CASE_NOT_READY.
      required: [caseId, channelId, liveId, snapshotId, evidenceVersion, policyVersion, handlingRoute, filterResult, matchingTags, version, messages, targets, targetMessageIds, targetVersions]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        evidenceVersion:
          type: integer
          minimum: 1
        policyVersion:
          type: string
          minLength: 1
          description: Nonblank policy version supplied by the current snapshot; no version value is settled here.
        handlingRoute:
          type: string
          enum: [PASS, RULE_CONFIRMED, CONTEXT_REVIEW, PII_INVESTIGATION, FLOOD_REVIEW]
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        matchingTags:
          type: array
          items:
            $ref: '#/components/schemas/MatchingTag'
        version:
          type: integer
          minimum: 1
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MaskedMessage'
        targets:
          type: array
          minItems: 1
          description: Distinct targets; each messageId must reference a message in this snapshot.
          items:
            $ref: '#/components/schemas/InternalCaseTarget'
        targetMessageIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Derived from targets, in the same order; never supplied independently.
          items:
            $ref: '#/components/schemas/Uuid'
        targetVersions:
          type: object
          description: Derived map of target message UUID to its current version.
          additionalProperties:
            type: integer
            minimum: 1
    InternalCaseTarget:
      type: object
      required: [messageId, visibility, version]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
          minimum: 1
    InternalCaseResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/InternalCase'
        traceId:
          type: string
          format: uuid
    ContextData:
      type: object
      required: [messages, truncated]
      properties:
        messages:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MaskedMessage'
        truncated:
          type: boolean
    ContextResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ContextData'
        traceId:
          type: string
          format: uuid
    UserHistory:
      type: object
      description: TIMEOUT history by category, excluding the current case; consumed kick-review cases remain included.
      required: [violationCount, windowHours, recentCases]
      properties:
        violationCount:
          type: integer
          minimum: 0
          description: Number of distinct cases, not the sum of category counts.
        windowHours:
          type: integer
          minimum: 1
          description: Actual resolved query window; no default or maximum days is established.
        recentCases:
          type: array
          items:
            $ref: '#/components/schemas/UserHistoryRecentCase'
    UserHistoryRecentCase:
      type: object
      required: [caseId, category, judgedAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/Category'
        judgedAt:
          $ref: '#/components/schemas/Timestamp'
    UserHistoryResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/UserHistory'
        traceId:
          type: string
          format: uuid
    ChannelInfo:
      type: object
      required: [officialHosts, events, authorRole, isOfficialOperator, observedLinks]
      properties:
        officialHosts:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/ChannelEventInfo'
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
        observedLinks:
          type: array
          items:
            $ref: '#/components/schemas/ObservedLink'
    ChannelEventInfo:
      type: object
      properties:
        title:
          type: [string, 'null']
        summary:
          type: [string, 'null']
    ObservedLink:
      type: object
      required: [messageId, host, isOfficial]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        host:
          type: string
        isOfficial:
          type: boolean
    ChannelInfoResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelInfo'
        traceId:
          type: string
          format: uuid
    AuthorRole:
      type: string
      enum: [VIEWER, STREAMER, OFFICIAL_STAFF, MODERATOR]
    ChannelUserRole:
      type: object
      required: [authorRole, isOfficialOperator]
      properties:
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
    ChannelUserRoleResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelUserRole'
        traceId:
          type: string
          format: uuid
    SecurityFacts:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items:
            $ref: '#/components/schemas/SecurityFact'
    SecurityFact:
      type: object
      required: [key, value, sourceRefs]
      properties:
        key:
          type: string
          minLength: 1
          description: Nonblank fact key.
        value:
          type: string
          enum: ['TRUE', 'FALSE', UNKNOWN]
        sourceRefs:
          type: array
          description: Required to be non-empty for TRUE/FALSE; UNKNOWN may have no source references.
          items:
            type: string
            minLength: 1
      allOf:
        - if:
            properties:
              value:
                enum: ['TRUE', 'FALSE']
            required: [value]
          then:
            properties:
              sourceRefs:
                minItems: 1
    SecurityFactsResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/SecurityFacts'
        traceId:
          type: string
          format: uuid
    KickEligibility:
      type: object
      description: |
        Distinct confirmed cases for the same user/channel/live across all five categories in the fixed
        24-hour window, including the current case. Revoked and consumed cases are excluded; TIMEOUT
        expiry alone does not revoke a case. Eligibility does not authorize KICK.
      required: [userId, channelId, liveId, asOf, windowHours, violationCount, eligibleCaseIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        asOf:
          $ref: '#/components/schemas/Timestamp'
        windowHours:
          type: integer
          const: 24
        violationCount:
          type: integer
          minimum: 0
          description: Must equal the number of distinct eligibleCaseIds.
        eligibleCaseIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickEligibilityResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickEligibility'
        traceId:
          type: string
          format: uuid
    KickReviewBasis:
      type: object
      description: Fixed approved review basis and consumption ownership; not a new eligibility count.
      required: [reviewId, decisionId, liveId, userId, basisSnapshotId, basisCaseIds, consumptions]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        consumptions:
          type: array
          description: Each consumption caseId must be in basisCaseIds. Only this review/decision may own consumption at revalidation.
          items:
            $ref: '#/components/schemas/KickReviewConsumption'
    KickReviewConsumption:
      type: object
      required: [caseId, reviewId, decisionId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    KickReviewBasisResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickReviewBasis'
        traceId:
          type: string
          format: uuid
    ActionType:
      type: string
      enum: [HIDE, TIMEOUT, RELEASE_HELD, KICK]
    BusinessActionCommand:
      type: object
      description: |
        Backend-issued command. KICK requires review/decision/basis/validation references and at least
        three distinct basisCaseIds. RELEASE_HELD may carry decisionId; other non-KICK commands must
        not carry kick basis references. durationSeconds is positive and required only for TIMEOUT.
      required: [actionId, planId, caseId, liveId, type, targetId, expectedEvidenceVersion, expectedTargetVersion, policyVersion, idempotencyKey]
      additionalProperties: false
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        planId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        targetId:
          $ref: '#/components/schemas/Uuid'
        expectedEvidenceVersion:
          type: integer
          minimum: 1
        expectedTargetVersion:
          type: integer
          minimum: 1
        policyVersion:
          type: string
          minLength: 1
          description: Nonblank, without a settled or hard-coded policy version.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank.
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
        decisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reviewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisSnapshotId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        validationRef:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisCaseIds:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties:
              type:
                const: TIMEOUT
            required: [type]
          then:
            required: [durationSeconds]
            properties:
              durationSeconds:
                type: integer
                minimum: 1
          else:
            properties:
              durationSeconds:
                type: 'null'
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            required: [decisionId, reviewId, basisSnapshotId, validationRef, basisCaseIds]
            properties:
              decisionId:
                $ref: '#/components/schemas/Uuid'
              reviewId:
                $ref: '#/components/schemas/Uuid'
              basisSnapshotId:
                $ref: '#/components/schemas/Uuid'
              validationRef:
                $ref: '#/components/schemas/Uuid'
              basisCaseIds:
                type: array
                minItems: 3
                uniqueItems: true
          else:
            properties:
              reviewId:
                type: 'null'
              basisSnapshotId:
                type: 'null'
              validationRef:
                type: 'null'
              basisCaseIds:
                anyOf:
                  - type: array
                    maxItems: 0
                  - type: 'null'
        - if:
            properties:
              type:
                enum: [HIDE, TIMEOUT]
            required: [type]
          then:
            properties:
              decisionId:
                type: 'null'
    ReconcileReviewRequest:
      type: object
      required: [caseId, decisionId]
      additionalProperties: false
      description: Body identifiers must match the caseId and decisionId path parameters.
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    ActionExecutionResult:
      type: object
      description: |
        UNKNOWN requires applied=null and a nonterminal PENDING/RUNNING status. CONFIRMED requires
        non-null applied. SUCCEEDED requires applied=true; FAILED requires applied=false.
        retryCount equals max(0, attemptCount - 1). KICK attemptCount is at most 3 and expiresAt is null
        because KICK ends with the live, not a fixed expiry.
      required: [actionId, caseId, liveId, type, status, observation, applied, attemptCount, retryCount, startedAt, expiresAt, errorCode]
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        observation:
          type: string
          enum: [CONFIRMED, UNKNOWN]
        applied:
          type: [boolean, 'null']
        attemptCount:
          type: integer
          minimum: 0
        retryCount:
          type: integer
          minimum: 0
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        errorCode:
          type: [string, 'null']
      allOf:
        - if:
            properties:
              observation:
                const: UNKNOWN
            required: [observation]
          then:
            properties:
              applied:
                type: 'null'
              status:
                enum: [PENDING, RUNNING]
        - if:
            properties:
              observation:
                const: CONFIRMED
            required: [observation]
          then:
            properties:
              applied:
                type: boolean
        - if:
            properties:
              status:
                const: SUCCEEDED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: true
        - if:
            properties:
              status:
                const: FAILED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: false
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            properties:
              attemptCount:
                maximum: 3
              expiresAt:
                type: 'null'
    ActionExecutionResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ActionExecutionResult'
        traceId:
          type: string
          format: uuid
    JudgmentRequest:
      type: object
      description: |
        verdict별 검증 (위반 시 400 VALIDATION_FAILED):
        - VIOLATION: category 필수, evidenceMessageIds 1개 이상, policyIds 1개 이상
        - NEEDS_REVIEW: missingFacts 1개 이상
        - NO_VIOLATION: 추가 필수 항목 없음
      required: [expectedVersion, verdict, evidenceMessageIds, policyIds, reason, traceId]
      additionalProperties: false
      allOf:
        - if:
            properties: { verdict: { const: VIOLATION } }
          then:
            required: [category]
            properties:
              category: { $ref: '#/components/schemas/Category' }
              evidenceMessageIds: { minItems: 1 }
              policyIds: { minItems: 1 }
        - if:
            properties: { verdict: { const: NEEDS_REVIEW } }
          then:
            required: [missingFacts]
            properties:
              missingFacts: { minItems: 1 }
      properties:
        expectedVersion:
          type: integer
        verdict:
          $ref: '#/components/schemas/Verdict'
        category:
          description: VIOLATION이면 필수
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        evidenceMessageIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        policyIds:
          type: array
          description: VIOLATION이면 1개 이상. 서버가 존재·버전을 검증
          items:
            type: string
        policySnapshots:
          type: array
          items:
            $ref: '#/components/schemas/PolicySnapshot'
        reason:
          type: string
        missingFacts:
          type: array
          items:
            type: string
        traceId:
          type: string
    JudgmentResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [caseStatus, violationCount, kickReviewId]
          properties:
            caseStatus:
              $ref: '#/components/schemas/CaseStatus'
            violationCount:
              type: integer
            kickReviewId:
              type: [string, 'null']
              format: uuid
              description: 누적 3회 도달 시 생성된 강퇴 검토 ID. Agent는 이 값이 있으면 interrupt 노드로 간다
        traceId:
          type: string
    KickResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [reviewId, status, startsAt, expiresAt, replayed]
          properties:
            reviewId:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/KickReviewStatus'
            startsAt:
              $ref: '#/components/schemas/Timestamp'
            expiresAt:
              $ref: '#/components/schemas/Timestamp'
            replayed:
              type: boolean
              description: 같은 Idempotency-Key 재요청이면 true
        traceId:
          type: string
    AgentEventRequest:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          enum: [TOOL_START, TOOL_END, TASK_FAILED]
        payload:
          type: object
