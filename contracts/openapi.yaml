        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        version:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ContextReview:
      type: object
      description: 문맥 확정 검토. AI 정상 제안(aiVerdict=NO_VIOLATION)이어도 운영자 결정 전까지 PENDING이다.
      required: [reviewId, kind, liveId, caseId, aiVerdict, evidenceVersion, status, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          const: CONTEXT
        liveId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        aiVerdict:
          $ref: '#/components/schemas/Verdict'
        evidenceVersion:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReviewStatus'
        version:
          type: integer
          description: 결정 요청의 expectedReviewVersion과 비교 (reviews.version)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    KickReview:
      type: object
      description: |
        강퇴 승인 검토. basisCaseIds는 심사 요청 때 고정한 기준 사건이며 승인 실행 근거를 새 사건으로 바꾸지 않는다.
        결정 상태(status)와 실제 강퇴 결과(ACTION_APPLIED·ACTION_FAILED)는 따로 본다. 강퇴는 방송 종료까지라 만료 시각이 없다.
      required: [reviewId, kind, liveId, userAlias, basisCaseIds, basisSnapshotId, status, summary, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          const: KICK
        liveId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        summary:
          type: string
          description: Agent가 작성한 검토 요약 (기준 사건의 근거)
        decisionReason:
          type: [string, 'null']
        version:
          type: integer
          description: 결정 요청의 expectedReviewVersion과 비교 (reviews.version)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Review:
