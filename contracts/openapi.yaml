  /internal/cases/{caseId}/judgment:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalSubmitJudgment
      summary: Agent 출력 제출 (Agent server → Backend, CONTRACTS §5)
      description: |
        PII_INVESTIGATION·CONTEXT_REVIEW 사건의 AI 조사 결과를 제출한다. 판정 제안은 AI_PROPOSAL finding으로 저장하고
        사람의 결정이나 BE 확정으로 덮어쓰지 않는다. 공개·제재 명령이 아니다.
        - CONTEXT_REVIEW: 판정과 무관하게 CONTEXT 검토를 만들고(A-9) Agent는 interrupt한다. NO_VIOLATION이어도 HELD 유지.
        - PII_INVESTIGATION: NO_VIOLATION은 이 사건의 hold 원인 해제, VIOLATION은 BE 검증 후 확정과 유형별 표 적용.
          BE 확정으로 강퇴 기준 3건에 도달하면 KICK 검토를 만든다. 이 두 판정은 운영자 검토를 만들지 않는다(필수 승인으로 확장하지 않음).
          messageFindings 중 하나라도 NEEDS_REVIEW면 사건을 확정하지 않고(confirmationStatus=PENDING) HELD를 유지하며,
          이 사건에 기존 CONTEXT 검토(kind=CONTEXT, caseId=이 사건)를 만든다. 운영자는 문맥 결정 API로 결정한다(A-16).
        본문 caseId는 경로와 같아야 하고, snapshotId·evidenceVersion이 현재 사건과 다르면 409 STALE_VERSION,
        policyVersion이 활성 버전(v3.1)과 다르면 400 VALIDATION_FAILED다. 같은 snapshotId·evidenceVersion 재제출은 같은 결과를 반환한다.
        TARGET 메시지마다 messageFindings가 정확히 하나 있어야 한다. 임의 TIMEOUT 기간이나 승인 여부는 받지 않는다.
      x-implementation-status: planned
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgmentRequest'
      responses:
        '200':
          description: 제출 처리
          content:
            application/json:
              schema:
