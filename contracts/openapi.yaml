        permissions, idempotency, and (for KICK) approval/basis. UNKNOWN observations are nonterminal.
      x-implementation-status: partial
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessActionCommand'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/reviews/{decisionId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/DecisionId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalReconcileReview
      summary: Legacy reconcile_review contract
      description: |
        Deprecated contract stub (501); not the CONTEXT/KICK decision or resume API.
        Does not approve KICK, unconsume cases, or automatically undo existing HIDE/TIMEOUT actions.
        Body caseId and decisionId must match the path. BE는 항상 501을 돌려주는 스텁이다. business-mcp에 reconcile_review 도구가 남아 있어,
        경로를 지우면 응답이 501에서 404로 바뀌므로 Agent 쪽 도구를 지울 때 함께 지운다(A-12).
      deprecated: true
      x-implementation-status: stub
      x-owner: B2
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileReviewRequest'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /internal/cases/{caseId}/events:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/TraceIdHeader'
    post:
      tags: [Internal]
      operationId: internalPostEvent
      summary: Agent 진행 이벤트 수신 → 관제 SSE 중계
      x-owner: B1
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEventRequest'
      responses:
        '202':
          description: 중계 완료
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /internal/reviews/{reviewId}/decisions/{decisionId}: {"get": {"tags": ["Internal"], "operationId": "internalReadStoredDecision", "security": [{"serviceToken": []}], "parameters": [{"name": "reviewId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Uuid"}}, {"name": "decisionId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Uuid"}}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InternalDecisionResponse"}}}}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}}}}
  /internal/reviews/{reviewId}/apply: {"post": {"tags": ["Internal"], "operationId": "internalApplyStoredContextDecision", "description": "Idempotent by stored final review/decision. Validates case/live/snapshot/evidence/policy/task/thread and actor. DEFER cannot apply.", "security": [{"serviceToken": []}], "parameters": [{"name": "reviewId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InternalApplyRequest"}}}}, "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InternalApplyResponse"}}}}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}}}}
  /api/findings/{findingId}/revoke: {"post": {"tags": ["Reviews"], "operationId": "revokeConfirmedFinding", "description": "담당 MODERATOR의 오판 취소. 기록·소진 이력은 보존하고 자기 hold 원인과 남은 유형별 TIMEOUT 및 강퇴 기준을 재검증한다. 다른 hold 원인이 있으면 공개하지 않는다.", "parameters": [{"name": "findingId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RevokeFindingRequest"}}}}, "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RevokeFindingResponse"}}}}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}}}}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LiveId:
      name: liveId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: UUID is reused; any non-UUID value is ignored and replaced with a generated UUID.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  responses:
    Error:
      description: 오류
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: Contract stub; no business operation was executed. Error code NOT_IMPLEMENTED, retryable=false.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotImplementedErrorResponse'
    EventStream:
      description: SSE. 각 이벤트는 `id`, `event`, `data`로 구성되고 `data`는 SseEnvelope(JSON)다. `id`는 envelope의 eventId와 같다.
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            id: 0d5b7c1e-8f2a-4c3b-9e1d-2a6f4b8c9d01
            event: MESSAGE_VISIBILITY_CHANGED
            data: {"eventId":"0d5b7c1e-8f2a-4c3b-9e1d-2a6f4b8c9d01","occurredAt":"2026-10-21T03:00:00Z","entityVersion":2,"payload":{"messageId":"33333333-3333-4333-8333-333333333333","visibility":"HIDDEN","version":2}}

            : ping

  headers:
    TraceId:
      description: UUID trace identifier reused from a valid request header or generated by the server.
      schema:
        type: string
        format: uuid

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Role:
      type: string
      enum: [VIEWER, MODERATOR, PLATFORM_ADMIN]
    Visibility:
      type: string
      enum: [PUBLIC, HELD, HIDDEN]
    FilterResult:
      type: string
      description: REVIEW는 v3.1 처리 경로에서 쓰지 않는다(새 의미를 부여하지 않음). 처리 경로는 HandlingRoute로 표현한다.
      enum: [PASS, REVIEW, HOLD, FLOOD]
    HandlingRoute:
      type: string
      description: |
        1차 필터가 정하는 처리 경로. 한 메시지에 하나.
        우선순위 RULE_CONFIRMED > FLOOD_REVIEW > PII_INVESTIGATION > CONTEXT_REVIEW > PASS (TBD-02).
      enum: [PASS, RULE_CONFIRMED, CONTEXT_REVIEW, PII_INVESTIGATION, FLOOD_REVIEW]
    ConfirmationStatus:
      type: string
      description: 사건 확정 상태(E-3). DEFER는 확정이 아니므로 PENDING을 유지한다.
      enum: [PENDING, CONFIRMED_VIOLATION, CONFIRMED_NORMAL, CANCELLED]
    ReviewKind:
      type: string
      enum: [CONTEXT, KICK]
    ReviewStatus:
      type: string
      description: 결정 상태. 실행 상태(ActionStatus)와 분리한다. 최종 결정이 저장될 때만 DECIDED.
      enum: [PENDING, DECIDED]
    ContextDecision:
      type: string
      description: DEFER는 공개 승인이 아니며 HELD를 유지한다.
      enum: [CONFIRM_NORMAL, CONFIRM_VIOLATION, DEFER]
    KickDecision:
      type: string
      enum: [APPROVE, REJECT]
    ActionStatus:
      type: string
      description: 실행 상태. 결과 미확인은 Observation으로 구분한다.
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    Observation:
      type: string
      description: UNKNOWN이면 applied=null이고 실패로 단정하지 않는다.
      enum: [CONFIRMED, UNKNOWN]
    ModerationReasonCode:
      type: string
      description: |
        작성자에게 보여 줄 처리 사유(A-3). PASS는 null.
        PROFANITY_INCLUDED: 확실한 욕설 포함으로 숨김. 탐지 단어 자체는 다시 출력하지 않는다.
        LINK_NOT_ALLOWED: 방송 내 링크 전송 금지. 피싱으로 검증했다는 주장을 넣지 않는다.
        FLOOD_REPEATED: 같은 문장 반복(도배).
        CONTEXT_PENDING: 문맥 확인 중(HELD).
        PII_PENDING: 개인정보 확인 중(HELD). 안내에 원문과 탐지 값(전화번호·계좌·이메일 등)을 다시 노출하지 않는다(POLICY §4).
      enum: [PROFANITY_INCLUDED, LINK_NOT_ALLOWED, FLOOD_REPEATED, CONTEXT_PENDING, PII_PENDING]
    PolicyVersion:
      type: string
      description: 활성 정책 버전. v3.1 고정(TBD-08, 환경변수 LIVEGUARD_POLICY_VERSION).
      const: v3.1
    MatchingTag:
      type: string
      description: |
        1차 필터가 걸린 조건. 한 메시지에 여러 개가 붙을 수 있고, filterResult가 같아도 태그로 이유를 구분한다(ERD §6, E-8).
        ATTACK_TERM: 공격·비하 사전(애매한 표현).
        CERTAIN_PROFANITY: 확실한 욕설.
        OFFICIAL_CLAIM: 공식 주체 자칭. CREDENTIAL_REQUEST: 로그인·인증 요구.
        LINK: 공식 링크 포함 모든 URL. v3.1은 방송 내 링크를 예외 없이 금지한다. v0.6의 UNOFFICIAL_URL을 대체한다.
        REPEATED_TEXT: 10초 안에 같은 정규화 문장 3회 이상(FLOOD).
        PII_PHONE·PII_ACCOUNT·PII_EMAIL: 전화번호·계좌(하이픈 묶음 10자리 이상)·이메일 형식 후보(PII_INVESTIGATION). 숫자 나열만으로는 붙지 않는다(AC-06).
        저장된 값은 데이터 마이그레이션 없이 바뀐다(A-15).
      enum: [ATTACK_TERM, CERTAIN_PROFANITY, OFFICIAL_CLAIM, CREDENTIAL_REQUEST, LINK, REPEATED_TEXT, PII_PHONE, PII_ACCOUNT, PII_EMAIL]
    CaseStatus:
      type: string
      description: 사건 처리 진행 상태(`cases.status`). 확정 여부는 ConfirmationStatus로 본다. 값 정리는 B2 확인 후(A-8).
      enum: [ANALYZING, NO_ACTION, HIDDEN, NEEDS_REVIEW, KICK_REVIEW_PENDING, CLOSED, FAILED]
    Verdict:
      type: string
      enum: [VIOLATION, NO_VIOLATION, NEEDS_REVIEW]
    Category:
      type: string
      enum: [PROFANITY, HARASSMENT, FLOOD, PHISHING, PII_EXPOSURE]
    ErrorCode:
      type: string
      description: |
        INTERNAL_ERROR: 처리되지 않은 서버 오류. HTTP 500, retryable=false. 응답에 내부 정보는 담지 않는다.
        NOT_IMPLEMENTED: 계약 스텁이며 업무 로직을 실행하지 않는다. HTTP 501, retryable=false.
        KICKED: 이 방송에서 강퇴됨(live ban). HTTP 403, retryable=false. 방송 종료까지 유효하므로 `until`을 보내지 않는다.
        TIMED_OUT: TIMEOUT 중 전송 거부. HTTP 403, retryable=false, `until` = TIMEOUT 만료 시각.
        429를 쓰지 않는다(클라이언트 Recovery가 429를 자동 재시도하므로, A-5).
        LIVE_ENDED: 이미 끝난 방송에 대한 요청. HTTP 409, retryable=false.
        LIVE_ALREADY_ACTIVE: 채널에 진행 중인 방송이 있는데 새 방송 시작. HTTP 409, retryable=false.
        REVIEW_NOT_APPROVED: 저장된 승인 결정이 없는 실행·재검증 요청. HTTP 422, retryable=false.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - KICKED
        - TIMED_OUT
        - LIVE_ENDED
        - LIVE_ALREADY_ACTIVE
        - NOT_FOUND
        - CASE_NOT_READY
        - STALE_VERSION
        - IDEMPOTENCY_CONFLICT
        - REVIEW_NOT_APPROVED
        - NOT_IMPLEMENTED
        - TEMPORARY_UNAVAILABLE
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            retryable:
              type: boolean
            until:
              $ref: '#/components/schemas/Timestamp'
              description: TIMED_OUT일 때만. TIMEOUT 만료 시각
            currentVersion:
              type: integer
        traceId:
          type: string
          format: uuid
    NotImplementedErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              const: NOT_IMPLEMENTED
            message:
              type: string
            retryable:
              type: boolean
              const: false
        traceId:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Me:
      type: object
      required: [userId, nickname, role, channelIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        channelIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    MeResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Me'
        traceId:
          type: string

    SendMessageRequest:
      type: object
      required: [clientMessageId, text]
      additionalProperties: false
      properties:
        clientMessageId:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
          minLength: 1
          maxLength: 500
    Live:
      type: object
      required: [liveId, channelId, startedAt, endedAt]
      properties:
        liveId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          description: null이면 방송 중
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    LiveResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Live'
        traceId:
          type: string
    Message:
      type: object
      description: |
        moderationReasonCode·moderationNotice·timeoutUntil·reviewStatus는 작성자 본인에게 보내는 응답에만 채우고,
        다른 사람에게는 null이다. 안내에는 탐지 단어·개인정보 원문을 다시 넣지 않는다.
      required: [messageId, liveId, channelId, authorAlias, text, visibility, version, sentAt, isMine]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          description: 방송 도입 전에 저장된 메시지는 null(A-17). 새 메시지는 항상 값이 있다
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        channelId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
        text:
          type: string
          description: HELD·HIDDEN 원문은 작성자·담당 운영자 응답에만 포함
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Timestamp'
        isMine:
          type: boolean
        moderationReasonCode:
          description: PASS는 null
          oneOf:
            - $ref: '#/components/schemas/ModerationReasonCode'
            - type: 'null'
        moderationNotice:
          type: [string, 'null']
          description: 작성자에게 보여 줄 사유 문장. 예) "메시지에 금지된 욕설이 포함되어 숨김 처리되었습니다."
        timeoutUntil:
          description: 실제 TIMEOUT이 적용됐을 때만. 첫 욕설처럼 TIMEOUT이 없으면 null
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        reviewStatus:
          description: HELD 조사·결정 대기면 PENDING, 그 외 null (A-4)
          oneOf:
            - $ref: '#/components/schemas/ReviewStatus'
            - type: 'null'
    SendMessageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Message'
        traceId:
          type: string
    MessagePageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            nextCursor:
              type: [string, 'null']
        traceId:
          type: string

    PolicySnapshot:
      type: object
      required: [policyId, version, title, text, resourceUri]
      properties:
        policyId:
          type: string
          examples: [CP-2.1]
        version:
          type: string
        title:
          type: string
        text:
          type: string
        resourceUri:
          type: string
          examples: ['policy://0.5/community_policy/CP-2.1']
    CaseSummary:
      type: object
      required: [caseId, liveId, channelId, userAlias, filterResult, handlingRoute, status, confirmationStatus, version, createdAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        handlingRoute:
          $ref: '#/components/schemas/HandlingRoute'
        status:
          $ref: '#/components/schemas/CaseStatus'
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        version:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ContextReview:
      type: object
      description: |
        문맥 확정 검토. AI 정상 제안(aiVerdict=NO_VIOLATION)이어도 운영자 결정 전까지 PENDING이다.
        Agent 판정이 마감 안에 오지 않았거나 분석이 거절되면 AI 판정 없이 열린다(A-25). 이때 aiVerdict=NEEDS_REVIEW,
        findings는 빈 배열이며 summary로 안내한다. 결정 전에 판정이 오면 aiVerdict·findings가 채워진다.
      required: [reviewId, kind, liveId, caseId, aiVerdict, evidenceVersion, status, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          const: CONTEXT
        liveId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        aiVerdict:
          $ref: '#/components/schemas/Verdict'
        evidenceVersion:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReviewStatus'
        version:
          type: integer
          description: 결정 요청의 expectedReviewVersion과 비교 (reviews.version)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    KickReview:
      type: object
      description: |
        강퇴 승인 검토. basisCaseIds는 심사 요청 때 고정한 기준 사건이며 승인 실행 근거를 새 사건으로 바꾸지 않는다.
        결정 상태(status)와 실제 강퇴 결과(ACTION_APPLIED·ACTION_FAILED)는 따로 본다. 강퇴는 방송 종료까지라 만료 시각이 없다.
      required: [reviewId, kind, liveId, userAlias, basisCaseIds, basisSnapshotId, status, summary, version, createdAt]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          const: KICK
        liveId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        summary:
          type: string
          description: Agent가 작성한 검토 요약 (기준 사건의 근거)
        decisionReason:
          type: [string, 'null']
        version:
          type: integer
          description: 결정 요청의 expectedReviewVersion과 비교 (reviews.version)
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Review:
      oneOf:
        - $ref: '#/components/schemas/ContextReviewCard'
        - $ref: '#/components/schemas/KickReviewCard'
      discriminator:
        propertyName: kind
        mapping:
          CONTEXT: '#/components/schemas/ContextReviewCard'
          KICK: '#/components/schemas/KickReviewCard'
    ReviewListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        traceId:
          type: string
    Decision:
      type: object
      description: 서버에 저장된 운영자 결정. 재개는 이 decisionId로 업무 DB 저장본을 읽는다.
      required: [decisionId, reviewId, kind, value, operatorId, decidedAt]
      properties:
        decisionId:
          $ref: '#/components/schemas/Uuid'
        reviewId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ReviewKind'
        value:
          description: kind=CONTEXT면 ContextDecision, kind=KICK이면 KickDecision
          oneOf:
            - $ref: '#/components/schemas/ContextDecision'
            - $ref: '#/components/schemas/KickDecision'
        operatorId:
          $ref: '#/components/schemas/Uuid'
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
    DecisionResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/Decision'
        traceId:
          type: string
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          required: [messages, reason, evidenceMessageIds, targetMessageIds, findings, policySnapshots, confirmedFindings, violationCount, kickReview]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            reason:
              type: [string, 'null']
            evidenceMessageIds:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
            targetMessageIds:
              type: array
              description: 이 사건의 지금 대상 메시지 id(보낸 순서). messages는 접수 당시 증거 사본이다
              items:
                $ref: '#/components/schemas/Uuid'
            findings:
              type: array
              description: AI 판정 제안(판정 제출 전이면 빈 배열). 확정 위반은 confirmedFindings다
              items:
                $ref: '#/components/schemas/MessageFinding'
            policySnapshots:
              type: array
              items:
                $ref: '#/components/schemas/PolicySnapshot'
            confirmedFindings:
              type: array
              items:
                $ref: '#/components/schemas/ConfirmedFinding'
            violationCount:
              type: integer
              description: |
                같은 방송에서 이 사용자의 다른 사건 중 취소되지 않은 확정 위반이 있는 사건 수(현재 사건 제외, 조회 시점 기준).
                TIMEOUT 이력과 같은 범위다(TBD-03). 강퇴 집계(KickEligibility, 최근 24시간·현재 포함)와 다르다.
            kickReview:
              $ref: '#/components/schemas/KickReviewState'
            traceUrl:
              type: [string, 'null']
    KickReviewState:
      type: object
      description: 이 사건에 걸린 대기 중 강퇴 검토. 없으면 required=false만 있다
      required: [required]
      properties:
        required:
          type: boolean
        reviewId:
          $ref: '#/components/schemas/Uuid'
        basisCaseIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    CaseListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseDetail'
        traceId:
          type: string
    CaseDetailResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/CaseDetail'
        traceId:
          type: string
    ContextDecisionRequest:
      type: object
      description: CONFIRM_VIOLATION이면 서버가 검증할 categories·evidenceMessageIds가 필수다(A-7). 다른 결정에서는 보내지 않는다.
      required: [clientRequestId, expectedReviewVersion, decision, reason]
      additionalProperties: false
      allOf:
        - if:
            properties: { decision: { const: CONFIRM_VIOLATION } }
            required: [decision]
          then:
            required: [categories, evidenceMessageIds]
          else:
            not:
              anyOf:
                - required: [categories]
                - required: [evidenceMessageIds]
      properties:
        clientRequestId:
          $ref: '#/components/schemas/Uuid'
        expectedReviewVersion:
          type: integer
        decision:
          $ref: '#/components/schemas/ContextDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Category'
        evidenceMessageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickDecisionRequest:
      type: object
      required: [clientRequestId, expectedReviewVersion, decision, reason]
      additionalProperties: false
      properties:
        clientRequestId:
          $ref: '#/components/schemas/Uuid'
        expectedReviewVersion:
          type: integer
        decision:
          $ref: '#/components/schemas/KickDecision'
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ----- SSE payload -----
    SseEnvelope:
      type: object
      description: 모든 SSE 이벤트 data의 공통 형태(CONTRACTS §12). payload는 이벤트 이름별 schema(x-sse-events).
      required: [eventId, occurredAt, entityVersion, payload]
      properties:
        eventId:
          $ref: '#/components/schemas/Uuid'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        entityVersion:
          type: [integer, 'null']
          description: 대상 엔티티(메시지·사건·검토·action)의 version. 버전이 없는 이벤트(TOOL_*, LIVE_ACCESS_BLOCKED 등)는 null
        payload:
          type: object
    ChatEvent:
      type: object
      description: CHAT과 MESSAGE_RESTORED의 payload
      required: [messageId, liveId, authorAlias, text, visibility, version, sentAt]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
        text:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    VisibilityChangedEvent:
      type: object
      description: 원문 없이 ID만. PUBLIC 복원은 MESSAGE_RESTORED(ChatEvent)로 보낸다.
      required: [messageId, visibility, version]
      additionalProperties: false
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
    LiveAccessBlockedEvent:
      type: object
      description: 이 방송에서 강퇴됨. 방송 종료까지 입장·채팅 금지이며 만료 시각이 없다. 안내 문구는 FE가 표시한다(A-14).
      required: [liveId, activeUntilLiveEnd]
      properties:
        liveId:
          $ref: '#/components/schemas/Uuid'
        activeUntilLiveEnd:
          type: boolean
          const: true
    ActionEvent:
      type: object
      description: ACTION_APPLIED·ACTION_FAILED의 payload. observation=UNKNOWN이면 결과 미확인이며 실패로 표시하지 않는다.
      required: [actionId, liveId, type, status, observation]
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        status:
          $ref: '#/components/schemas/ActionStatus'
        observation:
          $ref: '#/components/schemas/Observation'
    CaseEvent:
      type: object
      required: [caseId, liveId, status, handlingRoute, confirmationStatus, version]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CaseStatus'
        handlingRoute:
          $ref: '#/components/schemas/HandlingRoute'
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        version:
          type: integer
    ToolEvent:
      type: object
      required: [caseId, tool, callId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        tool:
          type: string
          examples: [get_chat_context]
        callId:
          type: string
        status:
          type: string
          description: TOOL_END에만
        elapsedMs:
          type: integer
          description: TOOL_END에만
    ContextReviewRequiredEvent:
      type: object
      description: 담당 운영자에게. AI 정상 제안이어도 결정이 필요하다. AI 판정 없이 열린 검토는 aiVerdict=NEEDS_REVIEW(A-25).
      required: [reviewId, caseId, aiVerdict]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        aiVerdict:
          $ref: '#/components/schemas/Verdict'
    KickReviewRequiredEvent:
      type: object
      description: 강퇴 승인 운영자에게. count는 통합 사건 수(다섯 유형 통합, 현재 포함).
      required: [reviewId, count]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        count:
          type: integer
          minimum: 3
    ReviewDecidedEvent:
      type: object
      description: 결정 저장 알림. 강퇴 완료를 뜻하지 않는다.
      required: [reviewId, reviewKind, decisionId, value]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        reviewKind:
          $ref: '#/components/schemas/ReviewKind'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        value:
          oneOf:
            - $ref: '#/components/schemas/ContextDecision'
            - $ref: '#/components/schemas/KickDecision'
    TaskFailedEvent:
      type: object
      required: [caseId, stage, errorCode]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        stage:
          type: string
        errorCode:
          type: string
        traceUrl:
          type: string

    # ----- Internal -----
    MaskedMessage:
      type: object
      required: [messageId, authorAlias, text, sentAt]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'
        messageId:
          $ref: '#/components/schemas/Uuid'
        authorAlias:
          type: string
          examples: [U1]
        text:
          type: string
          description: '[PHONE] [EMAIL] [ACCOUNT] [URL:host] 등으로 마스킹된 본문'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    InternalCase:
      type: object
      description: Immutable masked evidence shared with ContextData; current target state and case version are separate projections. Missing required metadata returns CASE_NOT_READY.
      required: [caseId, channelId, liveId, snapshotId, evidenceVersion, policyVersion, handlingRoute, filterResult, matchingTags, version, messages, targets, targetMessageIds, targetVersions]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        kickReview:
          type: object
          additionalProperties: true
        caseId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        evidenceVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        handlingRoute:
          $ref: '#/components/schemas/HandlingRoute'
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        matchingTags:
          type: array
          items:
            $ref: '#/components/schemas/MatchingTag'
        version:
          type: integer
          minimum: 1
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MaskedMessage'
        targets:
          type: array
          minItems: 1
          description: Distinct targets; each messageId must reference a message in this snapshot.
          items:
            $ref: '#/components/schemas/InternalCaseTarget'
        targetMessageIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Derived from targets, in the same order; never supplied independently.
          items:
            $ref: '#/components/schemas/Uuid'
        targetVersions:
          type: object
          description: Derived map of target message UUID to its current version.
          additionalProperties:
            type: integer
            minimum: 1
    InternalCaseTarget:
      type: object
      required: [messageId, visibility, version]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        visibility:
          $ref: '#/components/schemas/Visibility'
        version:
          type: integer
          minimum: 1
    InternalCaseResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/InternalCase'
        traceId:
          type: string
          format: uuid
    ContextData:
      type: object
      required: [messages, truncated]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        evidenceVersion:
          type: integer
          minimum: 1
        messages:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MaskedMessage'
        truncated:
          type: boolean
    ContextResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ContextData'
        traceId:
          type: string
          format: uuid
    UserHistory:
      type: object
      description: |
        TIMEOUT history by category, excluding the current case; consumed kick-review cases remain included.
        범위는 같은 userId·liveId의 방송 전체(TBD-03)라 조회 창(windowHours)을 응답에 두지 않는다(A-13).
      required: [violationCount, recentCases]
      properties:
        violationCount:
          type: integer
          minimum: 0
          description: Number of distinct cases, not the sum of category counts.
        recentCases:
          type: array
          items:
            $ref: '#/components/schemas/UserHistoryRecentCase'
    UserHistoryRecentCase:
      type: object
      required: [caseId, category, confirmedAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/Category'
        confirmedAt:
          $ref: '#/components/schemas/Timestamp'
          description: BE 확정 시각(findings.confirmed_at). v0.6의 judgedAt을 대체한다(A-13)
    UserHistoryResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/UserHistory'
        traceId:
          type: string
          format: uuid
    ChannelInfo:
      type: object
      required: [officialHosts, events, authorRole, isOfficialOperator, observedLinks]
      properties:
        officialHosts:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/ChannelEventInfo'
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
          description: True only for a confirmed STREAMER, OFFICIAL_STAFF or MODERATOR. False means "not confirmed as official", not "confirmed as a viewer" (UNKNOWN is also false).
        observedLinks:
          type: array
          items:
            $ref: '#/components/schemas/ObservedLink'
    ChannelEventInfo:
      type: object
      properties:
        title:
          type: [string, 'null']
        summary:
          type: [string, 'null']
    ObservedLink:
      type: object
      required: [messageId, host, isOfficial]
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        host:
          type: string
        isOfficial:
          type: boolean
    ChannelInfoResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelInfo'
        traceId:
          type: string
          format: uuid
    AuthorRole:
      type: string
      description: |
        Current channel role of the case author. UNKNOWN means the current membership cannot be confirmed
        (e.g. the author left the channel). Consumers must not treat UNKNOWN as an official operator nor as
        a VIEWER.
      enum: [VIEWER, STREAMER, OFFICIAL_STAFF, MODERATOR, UNKNOWN]
    ChannelUserRole:
      type: object
      required: [authorRole, isOfficialOperator]
      properties:
        authorRole:
          $ref: '#/components/schemas/AuthorRole'
        isOfficialOperator:
          type: boolean
          description: True only for a confirmed STREAMER, OFFICIAL_STAFF or MODERATOR. False means "not confirmed as official", not "confirmed as a viewer" (UNKNOWN is also false).
    ChannelUserRoleResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ChannelUserRole'
        traceId:
          type: string
          format: uuid
    SecurityFacts:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items:
            $ref: '#/components/schemas/SecurityFact'
    SecurityFact:
      type: object
      required: [key, value, sourceRefs]
      properties:
        key:
          type: string
          minLength: 1
          description: Nonblank fact key.
        value:
          type: string
          enum: ['TRUE', 'FALSE', UNKNOWN]
        sourceRefs:
          type: array
          description: Required to be non-empty for TRUE/FALSE; UNKNOWN may have no source references.
          items:
            type: string
            minLength: 1
      allOf:
        - if:
            properties:
              value:
                enum: ['TRUE', 'FALSE']
            required: [value]
          then:
            properties:
              sourceRefs:
                minItems: 1
    SecurityFactsResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/SecurityFacts'
        traceId:
          type: string
          format: uuid
    KickEligibility:
      type: object
      description: |
        Distinct confirmed cases for the same user/live across all five categories in the fixed
        24-hour window, including the current case. Revoked, consumed and reserved cases are excluded; TIMEOUT
        expiry alone does not revoke a case. Eligibility does not authorize KICK.
      required: [userId, channelId, liveId, asOf, windowHours, count, eligibleCaseIds]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        asOf:
          $ref: '#/components/schemas/Timestamp'
        windowHours:
          type: integer
          const: 24
        count:
          type: integer
          minimum: 0
          description: 통합 사건 수(CONTRACTS §3 KickEligibility.count). Must equal the number of distinct eligibleCaseIds.
        eligibleCaseIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    KickEligibilityResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickEligibility'
        traceId:
          type: string
          format: uuid
    KickReviewBasis:
      type: object
      description: Fixed approved review basis and consumption ownership; not a new eligibility count.
      required: [reviewId, decisionId, liveId, userId, basisSnapshotId, basisCaseIds, consumptions]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        basisSnapshotId:
          $ref: '#/components/schemas/Uuid'
        basisCaseIds:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        consumptions:
          type: array
          description: Each consumption caseId must be in basisCaseIds. Only this review/decision may own consumption at revalidation.
          items:
            $ref: '#/components/schemas/KickReviewConsumption'
    KickReviewConsumption:
      type: object
      required: [caseId, reviewId, decisionId]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    KickReviewBasisResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/KickReviewBasis'
        traceId:
          type: string
          format: uuid
    ActionType:
      type: string
      enum: [HIDE, TIMEOUT, RELEASE_HELD, KICK]
    BusinessActionCommand:
      type: object
      description: |
        Backend-issued command. KICK requires review/decision/basis/validation references and at least
        three distinct basisCaseIds. RELEASE_HELD may carry decisionId; other non-KICK commands must
        not carry kick basis references. durationSeconds is positive and required only for TIMEOUT.
      required: [actionId, planId, caseId, liveId, type, targetId, expectedEvidenceVersion, expectedTargetVersion, policyVersion, idempotencyKey]
      additionalProperties: false
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        planId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        targetId:
          $ref: '#/components/schemas/Uuid'
        expectedEvidenceVersion:
          type: integer
          minimum: 1
        expectedTargetVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank.
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
        decisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reviewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisSnapshotId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        validationRef:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisCaseIds:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties:
              type:
                const: TIMEOUT
            required: [type]
          then:
            required: [durationSeconds]
            properties:
              durationSeconds:
                type: integer
                minimum: 1
          else:
            properties:
              durationSeconds:
                type: 'null'
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            required: [decisionId, reviewId, basisSnapshotId, validationRef, basisCaseIds]
            properties:
              decisionId:
                $ref: '#/components/schemas/Uuid'
              reviewId:
                $ref: '#/components/schemas/Uuid'
              basisSnapshotId:
                $ref: '#/components/schemas/Uuid'
              validationRef:
                $ref: '#/components/schemas/Uuid'
              basisCaseIds:
                type: array
                minItems: 3
                uniqueItems: true
          else:
            properties:
              reviewId:
                type: 'null'
              basisSnapshotId:
                type: 'null'
              validationRef:
                type: 'null'
              basisCaseIds:
                anyOf:
                  - type: array
                    maxItems: 0
                  - type: 'null'
        - if:
            properties:
              type:
                enum: [HIDE, TIMEOUT]
            required: [type]
          then:
            properties:
              decisionId:
                type: 'null'
    ReconcileReviewRequest:
      type: object
      required: [caseId, decisionId]
      additionalProperties: false
      description: Body identifiers must match the caseId and decisionId path parameters.
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
    ActionExecutionResult:
      type: object
      description: |
        UNKNOWN requires applied=null and a nonterminal PENDING/RUNNING status. CONFIRMED requires
        non-null applied. SUCCEEDED requires applied=true; FAILED requires applied=false.
        retryCount equals max(0, attemptCount - 1). KICK attemptCount is at most 3 and expiresAt is null
        because KICK ends with the live, not a fixed expiry.
      required: [actionId, caseId, liveId, type, status, observation, applied, attemptCount, retryCount, startedAt, expiresAt, errorCode]
      properties:
        actionId:
          $ref: '#/components/schemas/Uuid'
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActionType'
        status:
          $ref: '#/components/schemas/ActionStatus'
        observation:
          $ref: '#/components/schemas/Observation'
        applied:
          type: [boolean, 'null']
        attemptCount:
          type: integer
          minimum: 0
        retryCount:
          type: integer
          minimum: 0
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        errorCode:
          type: [string, 'null']
      allOf:
        - if:
            properties:
              observation:
                const: UNKNOWN
            required: [observation]
          then:
            properties:
              applied:
                type: 'null'
              status:
                enum: [PENDING, RUNNING]
        - if:
            properties:
              observation:
                const: CONFIRMED
            required: [observation]
          then:
            properties:
              applied:
                type: boolean
        - if:
            properties:
              status:
                const: SUCCEEDED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: true
        - if:
            properties:
              status:
                const: FAILED
            required: [status]
          then:
            properties:
              observation:
                const: CONFIRMED
              applied:
                const: false
        - if:
            properties:
              type:
                const: KICK
            required: [type]
          then:
            properties:
              attemptCount:
                maximum: 3
              expiresAt:
                type: 'null'
    ActionExecutionResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ActionExecutionResult'
        traceId:
          type: string
          format: uuid
    JudgmentRequest:
      type: object
      description: Agent 출력(CONTRACTS §5). TARGET 메시지마다 messageFindings 하나.
      required: [caseId, liveId, handlingRoute, snapshotId, evidenceVersion, policyVersion, messageFindings]
      additionalProperties: false
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        handlingRoute:
          description: 사건의 handlingRoute와 같아야 한다. AI 조사 경로만 제출한다
          type: string
          enum: [CONTEXT_REVIEW, PII_INVESTIGATION]
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        evidenceVersion:
          type: integer
          minimum: 1
        policyVersion:
          $ref: '#/components/schemas/PolicyVersion'
        messageFindings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageFinding'
    MessageFinding:
      type: object
      description: |
        verdict별 검증 (어기면 400 VALIDATION_FAILED):
        - VIOLATION: categories 1개 이상, policyIds 1개 이상(서버가 존재·버전 검증)
        - NEEDS_REVIEW: missingFacts 1개 이상
        - NO_VIOLATION: categories는 빈 배열
      required: [messageId, verdict, categories, policyIds, reason, missingFacts]
      additionalProperties: false
      allOf:
        - if:
            properties: { verdict: { const: VIOLATION } }
            required: [verdict]
          then:
            properties:
              categories: { minItems: 1 }
              policyIds: { minItems: 1 }
        - if:
            properties: { verdict: { const: NEEDS_REVIEW } }
            required: [verdict]
          then:
            properties:
              missingFacts: { minItems: 1 }
        - if:
            properties: { verdict: { const: NO_VIOLATION } }
            required: [verdict]
          then:
            properties:
              categories: { maxItems: 0 }
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        verdict:
          $ref: '#/components/schemas/Verdict'
        categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Category'
        policyIds:
          type: array
          items:
            type: string
        reason:
          type: string
        missingFacts:
          type: array
          items:
            type: string
    JudgmentResultResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          description: |
            이 제출로 만들어진 검토(A-9, A-16).
            - CONTEXT_REVIEW: CONTEXT 검토
            - PII_INVESTIGATION + NEEDS_REVIEW(하나라도): CONTEXT 검토. 결정은 POST /api/context-reviews/{reviewId}/decision
            - PII_INVESTIGATION + VIOLATION이 BE 확정돼 강퇴 기준 3건 도달: KICK 검토
            그 외(PII의 NO_VIOLATION, 3건 미만 VIOLATION)는 reviewId·reviewKind 둘 다 null.
            값이 있으면 Agent는 그 reviewId로 interrupt한다.
          required: [confirmationStatus, reviewId, reviewKind]
          properties:
            confirmationStatus:
              $ref: '#/components/schemas/ConfirmationStatus'
            reviewId:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            reviewKind:
              oneOf:
                - $ref: '#/components/schemas/ReviewKind'
                - type: 'null'
        traceId:
          type: string
    KickRevalidation:
      type: object
      required: [reviewId, decisionId, valid, validationRef, basisCaseIds]
      properties:
        reviewId:
          $ref: '#/components/schemas/Uuid'
        decisionId:
          $ref: '#/components/schemas/Uuid'
        valid:
          type: boolean
        validationRef:
          description: valid=true일 때만. kick 실행 명령(BusinessActionCommand.validationRef)에 넣는다
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        basisCaseIds:
          type: array
          uniqueItems: true
          description: 검증한 원 기준 집합(새 사건으로 바꾸지 않음)
          items:
            $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties: { valid: { const: true } }
            required: [valid]
          then:
            properties:
              validationRef: { $ref: '#/components/schemas/Uuid' }
          else:
            properties:
              validationRef: { type: 'null' }
    KickRevalidationResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/IssuedKickRevalidation'
        traceId:
          type: string
          format: uuid
    AgentEventRequest:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          enum: [TOOL_START, TOOL_END, TASK_FAILED]
        payload:
          type: object

