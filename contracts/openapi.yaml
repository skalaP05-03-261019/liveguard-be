      properties:
        data:
          $ref: '#/components/schemas/ContextData'
        traceId:
          type: string
          format: uuid
    UserHistory:
      type: object
      description: |
        TIMEOUT history by category, excluding the current case; consumed kick-review cases remain included.
        v1.0 목표: 범위는 같은 userId·liveId의 방송 전체(TBD-03)라 windowHours를 없애고, violationCount는 CONTRACTS 이름에 맞춘다.
        Java 계약 테스트와 함께 contracts.enums PR에서 바꾼다(A-13, B2 확인 요청).
      required: [violationCount, windowHours, recentCases]
      properties:
        violationCount:
          type: integer
          minimum: 0
          description: Number of distinct cases, not the sum of category counts.
        windowHours:
          type: integer
          minimum: 1
          description: Actual resolved query window; no default or maximum days is established.
        recentCases:
          type: array
          items:
            $ref: '#/components/schemas/UserHistoryRecentCase'
    UserHistoryRecentCase:
      type: object
      required: [caseId, category, confirmedAt]
      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/Category'
        confirmedAt:
          $ref: '#/components/schemas/Timestamp'
          description: BE 확정 시각(findings.confirmed_at). v0.6의 judgedAt을 대체한다(A-13)
    UserHistoryResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/UserHistory'
        traceId:
          type: string
          format: uuid
    ChannelInfo:
      type: object
      required: [officialHosts, events, authorRole, isOfficialOperator, observedLinks]
      properties:
        officialHosts:
