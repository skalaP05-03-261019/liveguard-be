      properties:
        caseId:
          $ref: '#/components/schemas/Uuid'
        liveId:
          $ref: '#/components/schemas/Uuid'
        channelId:
          $ref: '#/components/schemas/Uuid'
        userAlias:
          type: string
        filterResult:
          $ref: '#/components/schemas/FilterResult'
        handlingRoute:
          $ref: '#/components/schemas/HandlingRoute'
        status:
          $ref: '#/components/schemas/CaseStatus'
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        verdict:
          oneOf:
            - $ref: '#/components/schemas/Verdict'
